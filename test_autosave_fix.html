<!DOCTYPE html>
<html>
<head>
    <title>Test Autosave Fix</title>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
</head>
<body>
    <h1>Testing Autosave Fix</h1>
    
    <div x-data="{
        testPassed: false,
        testMessage: 'Running tests...'
    }">
        <p x-text="testMessage"></p>
        <p x-show="testPassed" style="color: green;">✓ Tests passed!</p>
        <p x-show="!testPassed" style="color: red;">✗ Tests failed!</p>
    </div>
    
    <script>
        // Test the event-based communication
        document.addEventListener('alpine:init', () => {
            Alpine.data('testComponent', () => ({
                actions: [],
                
                init() {
                    // Simulate the child component requesting data
                    this.$dispatch('request-actions-data');
                    
                    // Listen for the response
                    this.$el.addEventListener('actions-loaded', (e) => {
                        console.log('Child received actions:', e.detail.actions);
                        
                        // Test adding an action
                        const newAction = { id: 'test', type: 'email', subject: 'Test' };
                        this.actions.push(newAction);
                        this.$dispatch('action-added', { action: newAction });
                    });
                }
            }));
            
            Alpine.data('parentComponent', () => ({
                sequence: {
                    actions: [{ id: 'initial', type: 'email', subject: 'Initial' }]
                },
                
                init() {
                    // Listen for requests
                    document.addEventListener('request-actions-data', () => {
                        console.log('Parent received request for actions');
                        this.$dispatch('actions-loaded', {
                            actions: JSON.parse(JSON.stringify(this.sequence.actions))
                        });
                    });
                    
                    // Listen for new actions
                    document.addEventListener('action-added', (e) => {
                        console.log('Parent received new action:', e.detail.action);
                        this.sequence.actions.push(e.detail.action);
                        
                        // Verify the fix works
                        const testElement = document.querySelector('[x-data]');
                        if (testElement.__x) {
                            testElement.__x.$data.testPassed = this.sequence.actions.length === 2;
                            testElement.__x.$data.testMessage = testElement.__x.$data.testPassed 
                                ? 'Actions synchronized correctly!' 
                                : 'Actions synchronization failed!';
                        }
                    });
                }
            }));
        });
    </script>
    
    <div x-data="parentComponent"></div>
    <div x-data="testComponent"></div>
</body>
</html>
