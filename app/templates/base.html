<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{% block title %}Mon Application{% endblock %}</title>

        <!-- Tailwind CSS CDN -->
        <script src="https://cdn.tailwindcss.com"></script>

        <!-- Alpine.js CDN -->
        <script
            defer
            src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
        ></script>

        <!-- LineIcons CDN -->
        <link href="https://cdn.lineicons.com/5.1/line/lineicons.css" rel="stylesheet">

        <!-- Axios CDN -->
        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

        <!-- parseAxios configuration -->
        <script src="{{ url_for('static', filename='js/parseAxios.js') }}"></script>

        {% block head %}{% endblock %}
    </head>
    <body class="bg-gray-100">
        {% block content %}{% endblock %}
        <!-- Import script alpinejs  -->
        {% block scripts %}{% endblock %}
    </body>
</html>
