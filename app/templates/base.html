<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{% block title %}Mon Application{% endblock %}</title>

        <!-- Tailwind CSS via CDN -->
        <script src="https://cdn.tailwindcss.com"></script>
        <script src="{{ url_for('static', filename='js/tailwind-config.js') }}"></script>
        <style>
            /* Custom styles for Marki brand */
            .bg-marki-primary {
                background-color: #007ace;
            }
            .text-marki-primary {
                color: #007ace;
            }
            .border-marki-primary {
                border-color: #007ace;
            }
            .hover\:bg-marki-primary-dark:hover {
                background-color: #005bb5;
            }
            .focus\:ring-marki-primary:focus {
                box-shadow: 0 0 0 3px rgba(0, 122, 206, 0.5);
                border-color: #007ace;
            }
        </style>

        <!-- Alpine.js CDN -->
        <script
            defer
            src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
        ></script>

        <!-- Font Awesome local -->
        <link
            href="{{ url_for('static', filename='assets/fontawesome/css/fontawesome.css') }}"
            rel="stylesheet"
        />
        <link
            href="{{ url_for('static', filename='assets/fontawesome/css/regular.css') }}"
            rel="stylesheet"
        />
        <!-- Line Icons pour les icônes utilisées dans les fonctionnalités -->
        <link
            href="https://cdn.lineicons.com/4.0/lineicons.css"
            rel="stylesheet"
        />
        <!-- Axios CDN -->
        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

        <!-- parseAxios configuration -->
        <script src="{{ url_for('static', filename='js/parseAxios.js') }}"></script>

        {% block head %}{% endblock %}
    </head>
    <body>
        {% block content %}{% endblock %}
        <!-- Système de notifications -->
        {% include '_notifications.html' %}
        <!-- Import script alpinejs  -->
        {% block scripts %}{% endblock %}
    </body>
</html>
