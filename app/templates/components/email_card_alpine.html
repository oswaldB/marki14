<!-- email_card.html - Version complète avec colonne droite -->
<div x-data="emailCardState(action, index)" class="email-card-container">
    <!-- Composant Etape -->
    <div
        class="bg-white border border-gray-200 rounded-lg shadow-sm p-4 mb-4"
        x-show="action.type === 'email'"
    >
        <div class="flex flex-wrap items-center justify-between gap-4">
            <div>
                <h3 class="text-lg font-semibold text-gray-900">
                    Étape <span x-text="index + 1"></span>: Email
                </h3>
            </div>
            <div class="flex gap-2">
                <button
                    @click="editAction()"
                    class="bg-blue-500 text-white px-3 py-1 rounded text-sm hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
                >
                    <span class="mr-1">
                        <i class="fa-regular fa-edit"></i>
                    </span>
                    <span>Modifier</span>
                </button>
                <button
                    @click="deleteAction()"
                    class="bg-red-500 text-white px-3 py-1 rounded text-sm hover:bg-red-600 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2"
                >
                    <span class="mr-1">
                        <i class="fa-regular fa-trash-alt"></i>
                    </span>
                    <span>Supprimer</span>
                </button>
            </div>
        </div>

        <!-- Configuration de l'email -->
        <div class="mt-4 space-y-4">
            <!-- Délai -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1"
                    >Délai (jours)</label
                >
                <div>
                    <input
                        type="number"
                        x-model="action.delay"
                        class="w-full p-2 border border-gray-300 rounded-md focus:ring-marki-primary focus:border-marki-primary"
                        min="0"
                        placeholder="0"
                    />
                </div>
                <p class="text-xs text-gray-500 mt-1">
                    Nombre de jours avant l'envoi de cet email dans la séquence
                </p>
            </div>

            <!-- Profil SMTP -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1"
                    >Profil SMTP</label
                >
                <div class="relative">
                    <select
                        x-model="action.smtpProfileId"
                        class="w-full p-2 border border-gray-300 rounded-md text-sm focus:ring-marki-primary focus:border-marki-primary"
                    >
                        <option value="">Sélectionner un profil SMTP...</option>
                        <template
                            x-for="profile in smtpProfiles"
                            :key="profile.objectId"
                        >
                            <option
                                :value="profile.objectId"
                                x-text="`${profile.name} (${profile.email})`"
                            ></option>
                        </template>
                    </select>
                </div>
                <p
                    class="text-xs text-yellow-600 mt-1"
                    x-show="!action.smtpProfileId"
                >
                    <span class="mr-1">
                        <i class="fa-regular fa-exclamation-triangle"></i>
                    </span>
                    Veuillez sélectionner un profil SMTP pour l'envoi
                </p>
            </div>

            <!-- Expéditeur -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1"
                    >Expéditeur</label
                >
                <div>
                    <input
                        type="email"
                        x-model="action.senderEmail"
                        class="w-full p-2 border border-gray-300 rounded-md text-sm focus:ring-marki-primary focus:border-marki-primary"
                        placeholder="email@exemple.com"
                    />
                </div>
                <p class="text-xs text-gray-500 mt-1">
                    Laissez vide pour utiliser l'email du profil SMTP par défaut
                </p>
            </div>

            <!-- Sujet -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1"
                    >Sujet</label
                >
                <div>
                    <input
                        type="text"
                        x-model="action.subject"
                        class="w-full p-2 border border-gray-300 rounded-md focus:ring-marki-primary focus:border-marki-primary"
                        placeholder="Sujet de l'email..."
                    />
                </div>
            </div>

            <!-- Éditeur Froala avec colonne de variables -->
            <div class="mt-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- Colonne principale avec éditeur -->
                <div class="lg:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Contenu de l'email
                    </label>

                    <!-- Vérification que le conteneur existe -->
                    <template x-if="$refs.froalaEditor">
                        <div
                            x-ref="froalaEditor"
                            class="froala-editor-container mb-4"
                        >
                            <style>
                                .froala-editor-container {
                                    min-height: 300px;
                                    border: 1px solid #e2e8f0;
                                    border-radius: 0.375rem;
                                    background-color: white;
                                }
                            </style>
                        </div>
                    </template>

                    <!-- Message d'erreur si le conteneur n'existe pas -->
                    <template x-if="!$refs.froalaEditor">
                        <div
                            class="bg-red-50 border border-red-200 rounded-lg p-4 text-center"
                        >
                            <p class="text-sm text-red-700">
                                <i
                                    class="fa-regular fa-exclamation-triangle mr-1"
                                ></i>
                                Conteneur éditeur non disponible
                            </p>
                        </div>
                    </template>
                </div>

                <!-- Éditeur plein largeur sans colonne de variables -->
                <div class="lg:col-span-3">
                    <div class="mt-4">
                        <label
                            class="block text-sm font-medium text-gray-700 mb-2"
                        >
                            Contenu de l'email
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Drawer de confirmation de suppression -->
    <div
        x-show="deleteConfirmOpen"
        class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50"
    >
        <div class="bg-white rounded-lg shadow-xl w-full max-w-md mx-4">
            <div
                class="flex items-center justify-between p-4 border-b border-gray-200"
            >
                <h3 class="text-lg font-medium text-gray-900 flex items-center">
                    <span class="mr-2 text-red-500">
                        <i class="fa-regular fa-exclamation-triangle"></i>
                    </span>
                    Confirmation de suppression
                </h3>
                <button
                    @click="cancelDelete()"
                    class="text-gray-400 hover:text-gray-600 focus:outline-none"
                    aria-label="close"
                >
                    <i class="fa-regular fa-times text-xl"></i>
                </button>
            </div>
            <div class="p-4">
                <div>
                    <p class="text-gray-700">
                        Êtes-vous sûr de vouloir supprimer cette étape ?
                    </p>
                    <p class="text-sm text-gray-500 mt-1">
                        Cette action est irréversible.
                    </p>
                </div>
            </div>
            <div class="flex justify-end p-4 border-t border-gray-200">
                <button
                    @click="confirmDelete()"
                    class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2 mr-2"
                >
                    <span class="mr-1">
                        <i class="fa-regular fa-trash-alt"></i>
                    </span>
                    <span>Supprimer</span>
                </button>
                <button
                    @click="cancelDelete()"
                    class="bg-gray-200 text-gray-700 px-4 py-2 rounded hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2"
                >
                    Annuler
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    // State for email card component - complete version
    document.addEventListener("alpine:init", () => {
        Alpine.data("emailCardState", (action, index) => ({
            action: action,
            index: index,
            deleteConfirmOpen: false,
            froalaInstance: null,
            initialized: false,

            init() {
                console.log(
                    "Email card initialized - Action:",
                    this.index,
                    "Type:",
                    this.action.type,
                );

                // Check if editor container is ready before initializing
                if (!this.$refs.froalaEditor) {
                    console.warn("Froala editor container not ready yet");
                    setTimeout(() => this.init(), 100);
                    return;
                }

                this.setupFroalaEditor();
                this.setupEventListeners();
            },

            setupEventListeners() {
                // Event listeners setup (kept minimal for future extensibility)
            },

            setupFroalaEditor() {
                if (this.initialized) {
                    console.log("Already initialized");
                    return;
                }

                if (!window.FroalaEditor) {
                    console.error("Froala Editor not loaded!");
                    return;
                }

                try {
                    this.froalaInstance = new FroalaEditor(
                        this.$refs.froalaEditor,
                        {
                            toolbarButtons: {
                                moreText: {
                                    buttons: ["bold", "italic", "underline"],
                                    buttonsVisible: 3,
                                },
                                moreParagraph: {
                                    buttons: [
                                        "alignLeft",
                                        "alignCenter",
                                        "alignRight",
                                        "formatOL",
                                        "formatUL",
                                    ],
                                    buttonsVisible: 5,
                                },
                                moreRich: {
                                    buttons: ["insertLink", "insertImage"],
                                    buttonsVisible: 2,
                                },
                                moreMisc: {
                                    buttons: ["undo", "redo", "fullscreen"],
                                    align: "right",
                                    buttonsVisible: 3,
                                },
                            },
                            placeholderText: "Enter your email content here...",
                            charCounterCount: false,
                            language: "fr",
                            heightMin: 300,

                            events: {
                                contentChanged: () => {
                                    const htmlContent =
                                        this.froalaInstance.html.get();
                                    this.action.bodyStart = htmlContent;
                                    this.action.bodyEnd = "";
                                    console.log("Content updated");
                                },
                                initialized: () => {
                                    console.log(
                                        "Froala Editor initialized successfully",
                                    );
                                    this.initialized = true;

                                    // Load existing content
                                    if (this.action.bodyStart) {
                                        this.froalaInstance.html.set(
                                            this.action.bodyStart,
                                        );
                                    }
                                },
                            },
                        },
                    );

                    console.log("Froala Editor instance created");
                } catch (error) {
                    console.error("Error initializing Froala Editor:", error);
                }
            },

            editAction() {
                console.log("Editing action", this.index);
            },

            deleteAction() {
                this.deleteConfirmOpen = true;
            },

            confirmDelete() {
                this.$dispatch("delete-action", { index: this.index });
                this.deleteConfirmOpen = false;
            },

            cancelDelete() {
                this.deleteConfirmOpen = false;
            },
        }));
    });
</script>
