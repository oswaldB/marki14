<!-- column_config_drawer.html - Drawer de configuration des colonnes -->
<div class="relative z-50 w-auto h-auto">
    <button @click="configOpen=false" class="hidden" id="columnConfigTrigger">
        Open
    </button>
    <template x-teleport="body">
        <div
            x-show="configOpen"
            @keydown.window.escape="configOpen = false"
            class="relative z-[99]"
        >
            <div
                x-show="configOpen"
                x-transition.opacity.duration.600ms
                @click="configOpen = false"
                class="fixed inset-0 bg-black/10"
            ></div>
            <div class="overflow-hidden fixed inset-0">
                <div class="overflow-hidden absolute inset-0">
                    <div class="flex fixed inset-y-0 right-0 pl-10 max-w-full">
                        <div
                            x-show="configOpen"
                            @click.away="configOpen = false"
                            x-transition:enter="transform transition ease-in-out duration-500 sm:duration-700"
                            x-transition:enter-start="translate-x-full"
                            x-transition:enter-end="translate-x-0"
                            x-transition:leave="transform transition ease-in-out duration-500 sm:duration-700"
                            x-transition:leave-start="translate-x-0"
                            x-transition:leave-end="translate-x-full"
                            class="w-1/2 max-w-full"
                        >
                            <div
                                class="flex overflow-y-scroll flex-col h-full bg-white border-l shadow-lg border-neutral-100/70"
                            >
                                <div class="px-4 sm:px-5 py-5">
                                    <div
                                        class="flex justify-between items-start"
                                    >
                                        <h2
                                            class="text-base font-semibold leading-6 text-gray-900"
                                            id="slide-over-title"
                                        >
                                            Configuration des colonnes
                                        </h2>
                                        <div
                                            class="flex items-center ml-3 h-auto"
                                        >
                                            <button
                                                @click="configOpen=false"
                                                class="flex absolute right-0 z-30 justify-center items-center px-3 py-2 mt-6 mr-5 space-x-1 text-xs font-medium uppercase rounded-md border border-neutral-200 text-neutral-600 hover:bg-neutral-100"
                                            >
                                                <svg
                                                    xmlns="http://www.w3.org/2000/svg"
                                                    fill="none"
                                                    viewBox="0 0 24 24"
                                                    stroke-width="1.5"
                                                    stroke="currentColor"
                                                    class="w-4 h-4"
                                                >
                                                    <path
                                                        stroke-linecap="round"
                                                        stroke-linejoin="round"
                                                        d="M6 18L18 6M6 6l12 12"
                                                    ></path>
                                                </svg>
                                                <span>Fermer</span>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                                <div class="relative flex-1 px-4 sm:px-5">
                                    <div class="h-full px-4 sm:px-5">
                                        <div
                                            class="overflow-hidden h-full rounded-md border border-dashed border-neutral-300"
                                        >
                                            <!-- Contenu de configuration des colonnes -->
                                            <div
                                                class="p-4 h-full flex flex-col"
                                            >
                                                <p class="mb-4">
                                                    Configurez les colonnes du
                                                    tableau :
                                                </p>

                                                <div
                                                    class="bg-blue-100 border border-blue-400 text-blue-700 px-4 py-3 rounded mb-4 flex-shrink-0"
                                                >
                                                    <p class="mb-2">
                                                        <span
                                                            class="text-sm mr-2"
                                                        >
                                                            <i
                                                                class="fa-regular fa-arrows-up-down"
                                                            ></i>
                                                        </span>
                                                        <strong
                                                            >Chevrons</strong
                                                        >
                                                        pour réorganiser les
                                                        colonnes
                                                    </p>
                                                    <p class="mb-2">
                                                        <span
                                                            class="text-sm mr-2"
                                                        >
                                                            <i
                                                                class="fa-regular fa-eye"
                                                            ></i>
                                                        </span>
                                                        <strong
                                                            >Cocher/décocher</strong
                                                        >
                                                        pour afficher/masquer
                                                    </p>
                                                    <p>
                                                        <span
                                                            class="text-sm mr-2"
                                                        >
                                                            <i
                                                                class="fa-regular fa-pen-to-square"
                                                            ></i>
                                                        </span>
                                                        <strong
                                                            >Cliquer sur le
                                                            nom</strong
                                                        >
                                                        pour renommer
                                                    </p>
                                                </div>

                                                <div
                                                    class="column-config-list flex-1 overflow-y-auto"
                                                >
                                                    <template
                                                        x-for="column in emailTableState.tableConfig.availableColumns"
                                                        :key="column.id"
                                                    >
                                                        <div
                                                            class="bg-white border border-gray-200 rounded-lg p-4 shadow-sm mb-3"
                                                        >
                                                            <div
                                                                class="grid grid-cols-12 items-center gap-4"
                                                            >
                                                                <div
                                                                    class="col-span-1 text-center flex items-center justify-center"
                                                                >
                                                                    <div
                                                                        class="flex flex-col space-y-1"
                                                                    >
                                                                        <button
                                                                            class="bg-white border border-gray-300 text-gray-700 w-8 h-8 flex items-center justify-center rounded text-sm hover:bg-gray-50"
                                                                            @click="emailTableState.moveColumnUp(column.id)"
                                                                            :disabled="column.order === 0"
                                                                        >
                                                                            <span
                                                                                class="text-sm"
                                                                            >
                                                                                <i
                                                                                    class="fa-regular fa-chevron-up"
                                                                                ></i>
                                                                            </span>
                                                                        </button>
                                                                        <button
                                                                            class="bg-white border border-gray-300 text-gray-700 w-8 h-8 flex items-center justify-center rounded text-sm hover:bg-gray-50"
                                                                            @click="emailTableState.moveColumnDown(column.id)"
                                                                            :disabled="column.order === emailTableState.tableConfig.availableColumns.length - 1"
                                                                        >
                                                                            <span
                                                                                class="text-sm"
                                                                            >
                                                                                <i
                                                                                    class="fa-regular fa-chevron-down"
                                                                                ></i>
                                                                            </span>
                                                                        </button>
                                                                    </div>
                                                                </div>
                                                                <div
                                                                    class="col-span-9"
                                                                >
                                                                    <div
                                                                        x-show="emailTableState.editingColumnId !== column.id"
                                                                    >
                                                                        <span
                                                                            @click="emailTableState.startEditing(column.id)"
                                                                            class="column-name font-semibold"
                                                                            style="
                                                                                cursor: pointer;
                                                                            "
                                                                        >
                                                                            <span
                                                                                x-text="column.label"
                                                                            ></span>
                                                                            <span
                                                                                class="text-gray-500 ml-1"
                                                                            >
                                                                                <i
                                                                                    class="fa-regular fa-edit"
                                                                                ></i>
                                                                            </span>
                                                                        </span>
                                                                    </div>
                                                                    <div
                                                                        x-show="emailTableState.editingColumnId === column.id"
                                                                        x-transition
                                                                    >
                                                                        <div
                                                                            class="flex"
                                                                        >
                                                                            <div
                                                                                class="flex-1"
                                                                            >
                                                                                <input
                                                                                    type="text"
                                                                                    x-model="emailTableState.newColumnName"
                                                                                    @keyup.enter="emailTableState.saveColumnName(column.id)"
                                                                                    @keyup.escape="emailTableState.cancelEditing()"
                                                                                    class="w-full border border-gray-300 rounded px-2 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-marki-primary focus:border-transparent"
                                                                                    placeholder="Nouveau nom"
                                                                                />
                                                                            </div>
                                                                            <div>
                                                                                <button
                                                                                    @click="emailTableState.saveColumnName(column.id)"
                                                                                    class="bg-green-500 text-white px-2 py-1 rounded text-sm hover:bg-green-600 ml-1"
                                                                                >
                                                                                    <span
                                                                                        class="text-sm"
                                                                                    >
                                                                                        <i
                                                                                            class="fa-regular fa-check"
                                                                                        ></i>
                                                                                    </span>
                                                                                </button>
                                                                            </div>
                                                                            <div>
                                                                                <button
                                                                                    @click="emailTableState.cancelEditing()"
                                                                                    class="bg-red-500 text-white px-2 py-1 rounded text-sm hover:bg-red-600 ml-1"
                                                                                >
                                                                                    <span
                                                                                        class="text-sm"
                                                                                    >
                                                                                        <i
                                                                                            class="fa-regular fa-times"
                                                                                        ></i>
                                                                                    </span>
                                                                                </button>
                                                                            </div>
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                                <div
                                                                    class="col-span-2 text-right"
                                                                >
                                                                    <span
                                                                        class="text-gray-500 cursor-pointer"
                                                                        style="
                                                                            cursor: pointer;
                                                                        "
                                                                        @click="emailTableState.toggleColumnVisibility(column.id)"
                                                                    >
                                                                        <i
                                                                            class="fas"
                                                                            :class="column.visible ? 'fa-eye' : 'fa-eye-slash'"
                                                                        ></i>
                                                                    </span>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </template>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>
</div>
