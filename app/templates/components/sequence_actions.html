<!-- sequence_actions.html - Composant pour la gestion des actions/étapes de séquence -->
<div
    x-data="sequenceActionsState()"
    class="sequence-actions-container"
    @delete-action.window="deleteActionByIndex($event.detail.index)"
>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <!-- Colonne principale : Actions -->
        <div class="md:col-span-2">
            <div class="flex space-x-2 mb-4">
                <button
                    @click="addAction('email')"
                    class="bg-green-500 text-white px-3 py-2 rounded hover:bg-green-600"
                >
                    <span class="text-sm">
                        <i class="fa-regular fa-plus"></i>
                    </span>
                    <span>Ajouter un email</span>
                </button>
            </div>

            <!-- Liste des étapes -->
            <div>
                <template
                    x-for="(action, index) in actions"
                    :key="action.id || index"
                >
                    {% include 'components/email_card.html' with context %}
                </template>

                <div x-show="actions.length === 0" class="text-center">
                    <p class="text-gray-500">
                        Aucune étape définie pour cette séquence.
                    </p>
                    <p class="text-gray-500">
                        Ajoutez des étapes en utilisant le bouton ci-dessus.
                    </p>
                </div>
            </div>
        </div>

        <!-- Colonne de droite : Variables -->
        <div class="md:col-span-1">
            {% include 'components/sequence_variables.html' %}
        </div>
    </div>
</div>
