<!-- Panneau création/édition d'un profil SMTP -->
<div x-data="smtpProfilePanel">
    <div
        x-show="panelOpen"
        x-transition:enter="transition ease-out duration-300"
        x-transition:enter-start="translate-x-full"
        x-transition:enter-end="translate-x-0"
        x-transition:leave="transition ease-in duration-200"
        x-transition:leave-start="translate-x-0"
        x-transition:leave-end="translate-x-full"
        class="fixed inset-y-0 right-0 w-[480px] bg-white border-l border-gray-200 shadow-xl z-50 flex flex-col overflow-y-auto"
    >
        <header class="border-b border-gray-200 p-4 flex justify-between items-center">
            <p class="text-lg font-semibold">
                <span x-text="editingProfile ? 'Modifier le profil SMTP' : 'Créer un profil SMTP'"></span>
            </p>
            <button @click="close()" class="text-gray-400 hover:text-gray-600" aria-label="close">
                <i class="fa-regular fa-times text-xl"></i>
            </button>
        </header>

        <section class="p-4 flex-1">
            <form @submit.prevent="save()">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nom du profil</label>
                    <input
                        type="text"
                        x-model="currentProfile.name"
                        required
                        class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-marki-primary focus:border-transparent"
                    />
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input
                        type="email"
                        x-model="currentProfile.email"
                        required
                        class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-marki-primary focus:border-transparent"
                    />
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nom de l'expéditeur</label>
                    <input
                        type="text"
                        x-model="currentProfile.fromName"
                        class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-marki-primary focus:border-transparent"
                    />
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Hôte SMTP</label>
                    <input
                        type="text"
                        x-model="currentProfile.host"
                        required
                        class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-marki-primary focus:border-transparent"
                    />
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Port</label>
                    <input
                        type="text"
                        x-model="currentProfile.port"
                        required
                        class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-marki-primary focus:border-transparent"
                    />
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nom d'utilisateur</label>
                    <input
                        type="text"
                        x-model="currentProfile.username"
                        required
                        class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-marki-primary focus:border-transparent"
                    />
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Mot de passe</label>
                    <input
                        type="password"
                        x-model="currentProfile.password"
                        :required="!editingProfile"
                        class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-marki-primary focus:border-transparent"
                    />
                    <p x-show="editingProfile" class="text-xs text-gray-500 mt-1">Laissez vide pour ne pas modifier le mot de passe</p>
                </div>

                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div class="flex items-center">
                        <input type="checkbox" x-model="currentProfile.useSSL" class="mr-2" />
                        <label class="text-sm text-gray-700">Utiliser SSL</label>
                    </div>
                    <div class="flex items-center">
                        <input type="checkbox" x-model="currentProfile.useTLS" class="mr-2" />
                        <label class="text-sm text-gray-700">Utiliser TLS</label>
                    </div>
                    <div class="flex items-center">
                        <input type="checkbox" x-model="currentProfile.isActive" class="mr-2" />
                        <label class="text-sm text-gray-700">Profil actif</label>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Signature HTML</label>
                    <textarea
                        x-model="currentProfile.htmlSignature"
                        rows="4"
                        class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-marki-primary focus:border-transparent"
                    ></textarea>
                </div>

                <div class="flex justify-end space-x-2 mt-6">
                    <button
                        type="button"
                        @click="close()"
                        class="bg-white border border-gray-300 text-gray-700 px-4 py-2 rounded hover:bg-gray-50"
                    >
                        Annuler
                    </button>
                    <button
                        type="submit"
                        :disabled="saving"
                        class="bg-marki-primary text-white px-4 py-2 rounded hover:bg-marki-primary-dark disabled:opacity-50"
                    >
                        <span x-text="saving ? 'Enregistrement...' : (editingProfile ? 'Mettre à jour' : 'Créer')"></span>
                    </button>
                </div>
            </form>
        </section>
    </div>
</div>

<script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('smtpProfilePanel', () => ({
            panelOpen: false,
            editingProfile: null,
            saving: false,
            currentProfile: {
                name: '', email: '', fromName: '', host: '', port: '',
                username: '', password: '', useSSL: false, useTLS: false,
                isActive: true, htmlSignature: ''
            },

            init() {
                window.addEventListener('open-smtp-panel', (e) => {
                    this.openPanel(e.detail?.profile || null);
                });
            },

            openPanel(profile = null) {
                this.editingProfile = profile;
                this.currentProfile = profile
                    ? { ...profile, password: '' }
                    : { name: '', email: '', fromName: '', host: '', port: '', username: '', password: '', useSSL: false, useTLS: false, isActive: true, htmlSignature: '' };
                this.panelOpen = true;
            },

            close() {
                this.panelOpen = false;
                this.editingProfile = null;
            },

            async save() {
                this.saving = true;
                try {
                    const data = { ...this.currentProfile };
                    if (this.editingProfile && !data.password) delete data.password;

                    let savedProfile;
                    if (this.editingProfile) {
                        await parseAxios.put(`/classes/SMTPProfile/${this.editingProfile.objectId}`, data);
                        savedProfile = { ...this.currentProfile, objectId: this.editingProfile.objectId };
                    } else {
                        const res = await parseAxios.post('/classes/SMTPProfile', data);
                        savedProfile = { ...this.currentProfile, objectId: res.data.objectId };
                    }

                    window.dispatchEvent(new CustomEvent('smtp-profile-saved', {
                        detail: { profile: savedProfile, isNew: !this.editingProfile }
                    }));
                    Alpine.store('notifications').add({
                        type: 'success',
                        message: this.editingProfile ? 'Profil SMTP mis à jour' : 'Profil SMTP créé'
                    });
                    this.close();
                } catch (e) {
                    Alpine.store('notifications').add({ type: 'error', message: 'Erreur lors de la sauvegarde du profil' });
                } finally {
                    this.saving = false;
                }
            }
        }))
    })
</script>
