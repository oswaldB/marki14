<template x-if="action.type === 'email'">
    <div x-data="{
        isExpanded: true,
        
        updateSubject() {
            updateActionField(index, 'subject', action.subject);
        },
        
        updateCC() {
            updateActionField(index, 'cc', action.cc);
        },
        
        updateDelay() {
            updateActionField(index, 'delay', parseInt(action.delay) || 0);
        },
        
        handleContentChange(event) {
            updateActionField(index, 'body', event.detail.content);
        },
        
        toggleExpand() {
            this.isExpanded = !this.isExpanded;
        }
    }" class="border border-gray-200 rounded-lg mb-4 bg-white overflow-hidden">
        <!-- Header with collapse/expand toggle -->
        <div class="flex justify-between items-center p-4 bg-gray-50 cursor-pointer hover:bg-gray-100" @click="toggleExpand">
            <div class="flex items-center flex-1 min-w-0">
                <button class="mr-3 text-gray-500 hover:text-gray-700">
                    <i class="fas" :class="isExpanded ? 'fa-chevron-down' : 'fa-chevron-right'"></i>
                </button>
                <div class="flex-1 min-w-0">
                    <h4 class="text-lg font-semibold truncate" x-text="'Email Action ' + (index + 1)"></h4>
                    <div class="text-sm text-gray-600 mt-1">
                        <span class="font-medium">Objet:</span>
                        <span class="truncate block" x-text="action.subject || 'Sans objet'"></span>
                        <span class="font-medium mt-1 block">Délai:</span>
                        <span class="block" x-text="action.delay + ' jours'"></span>
                    </div>
                </div>
            </div>
            <button @click.stop="removeAction(index)" class="text-red-500 hover:text-red-700 ml-4">
                <i class="fas fa-trash"></i> Supprimer
            </button>
        </div>
        
        <!-- Expanded content -->
        <div x-show="isExpanded" x-collapse>
            <div class="p-4 border-t border-gray-200">
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Objet</label>
                <input
                    type="text"
                    x-model="action.subject"
                    @blur="updateSubject()"
                    placeholder="Objet de l'email..."
                    class="w-full p-2 border border-gray-300 rounded"
                />
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">CC</label>
                <input
                    type="text"
                    x-model="action.cc"
                    @blur="updateCC()"
                    placeholder="Adresses en copie..."
                    class="w-full p-2 border border-gray-300 rounded"
                />
            </div>
        </div>
        
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Délai (jours)</label>
            <input
                type="number"
                x-model="action.delay"
                @blur="updateDelay()"
                min="0"
                class="w-full p-2 border border-gray-300 rounded"
            />
        </div>
        
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Message</label>
            <toastui-editor-lit
                .content="action.body"
                @content-change="handleContentChange"
                height="300px"
                class="border border-gray-300 rounded">
            </toastui-editor-lit>
        </div>
            </div>
        </div>
    </div>
</template>
