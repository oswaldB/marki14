<template x-if="action.type === 'email'">
    <div
        x-data="{
        isExpanded: true,
        showConfirmDelete: false,

        updateSubject() {
            updateActionField(index, 'subject', action.subject);
        },

        updateCC() {
            updateActionField(index, 'cc', action.cc);
        },

        updateDelay() {
            updateActionField(index, 'delay', parseInt(action.delay) || 0);
        },

        updateSenderEmail() {
            updateActionField(index, 'senderEmail', action.senderEmail);
        },

        handleContentChange(event) {
            console.log('Handling content change for action', index, ':', event.detail.content);
            // Dispatch an event with the index and content
            // The container component will handle the store update
            const changeEvent = new CustomEvent('email-body-changed', {
                detail: {
                    index: index,
                    content: event.detail.content
                },
                bubbles: true
            });
            this.$dispatch('email-body-changed', {
                index: index,
                content: event.detail.content
            });
            console.log('Event dispatched for action', index);
        },

        toggleExpand() {
            this.isExpanded = !this.isExpanded;
        },

        confirmDelete() {
            this.showConfirmDelete = true;
        },

        cancelDelete() {
            this.showConfirmDelete = false;
        },

        executeDelete() {
            removeAction(index);
            this.showConfirmDelete = false;
        }
    }"
        class="action-card mb-4 overflow-hidden"
    >
        <!-- Header with collapse/expand toggle - compact column layout -->
        <div
            class="grid grid-cols-12 gap-3 p-4 action-header cursor-pointer hover:bg-gray-100 items-center transition-all"
            @click="toggleExpand"
        >
            <div class="col-span-1 flex justify-center">
                <button
                    class="text-gray-500 hover:text-gray-700 transition-all"
                >
                    <i
                        class="fas"
                        :class="isExpanded ? 'fa-chevron-down' : 'fa-chevron-right'"
                    ></i>
                </button>
            </div>
            <div class="col-span-3">
                <span
                    class="action-badge"
                    x-text="'Action ' + (index + 1)"
                ></span>
            </div>
            <div class="col-span-4">
                <div class="text-sm">
                    <span class="font-medium text-gray-600">Objet:</span>
                    <span
                        class="truncate block font-medium text-gray-800"
                        x-text="action.subject || 'Sans objet'"
                    ></span>
                </div>
            </div>
            <div class="col-span-2">
                <div class="text-sm">
                    <span class="font-medium text-gray-600">Délai:</span>
                    <span
                        class="block font-medium text-gray-800"
                        x-text="action.delay + ' jours'"
                    ></span>
                </div>
            </div>
            <div class="col-span-2 flex justify-end">
                <button
                    @click.stop="confirmDelete()"
                    class="text-red-500 hover:text-red-700 transition-all"
                >
                    <i class="fas fa-trash"></i>
                </button>
            </div>
        </div>

        <!-- Confirmation Dialog -->
        <div
            x-show="showConfirmDelete"
            x-transition:enter="transition ease-out duration-100"
            x-transition:enter-start="transform opacity-0 scale-95"
            x-transition:enter-end="transform opacity-100 scale-100"
            x-transition:leave="transition ease-in duration-75"
            x-transition:leave-start="transform opacity-100 scale-100"
            x-transition:leave-end="transform opacity-0 scale-95"
            class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50"
            @click.away="cancelDelete()"
        >
            <div class="bg-white rounded-lg p-6 shadow-xl max-w-sm w-full mx-4" @click.stop>
                <h3 class="text-lg font-medium text-gray-900 mb-4">Confirmer la suppression</h3>
                <p class="text-gray-600 mb-6">Êtes-vous sûr de vouloir supprimer cette action ?</p>
                <div class="flex justify-end gap-3">
                    <button
                        @click="cancelDelete()"
                        class="px-4 py-2 text-gray-700 hover:text-gray-900 transition-all"
                    >
                        Annuler
                    </button>
                    <button
                        @click="executeDelete()"
                        class="px-4 py-2 bg-red-500 text-white rounded hover:bg-red-600 transition-all"
                    >
                        Supprimer
                    </button>
                </div>
            </div>
        </div>

        <!-- Expanded content -->
        <div x-show="isExpanded" x-collapse>
            <div class="p-4 border-t border-gray-200">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                    <div>
                        <label
                            class="block text-sm font-medium text-gray-700 mb-1"
                            >Objet</label
                        >
                        <input
                            type="text"
                            x-model="action.subject"
                            @blur="updateSubject()"
                            placeholder="Objet de l'email..."
                            class="focus:ring-2 transition-all"
                        />
                    </div>

                    <div>
                        <label
                            class="block text-sm font-medium text-gray-700 mb-1"
                            >CC</label
                        >
                        <input
                            type="text"
                            x-model="action.cc"
                            @blur="updateCC()"
                            placeholder="Adresses en copie..."
                            class="focus:ring-2 transition-all"
                        />
                    </div>
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1"
                        >Délai (jours)</label
                    >
                    <input
                        type="number"
                        x-model="action.delay"
                        @blur="updateDelay()"
                        min="0"
                        class="focus:ring-2 transition-all"
                    />
                </div>

                <!-- Modern SMTP Profile Selector -->
                <div class="mb-4">
                    <div class="flex items-center justify-between mb-1">
                        <label class="block text-sm font-medium text-gray-700">Profil SMTP</label>
                        <button
                            type="button"
                            x-show="$store.sequence.smtpProfiles.profiles.length === 0"
                            @click="window.dispatchEvent(new CustomEvent('open-smtp-panel', { detail: {} }))"
                            class="text-xs text-marki-primary hover:underline flex items-center gap-1"
                        >
                            <i class="fa-regular fa-plus-circle"></i>
                            Créer un profil SMTP
                        </button>
                    </div>
                    <div
                        x-data="{
                isOpen: false,
                searchTerm: '',

                toggleDropdown() {
                    this.isOpen = !this.isOpen;
                    if (this.isOpen) {
                        this.$nextTick(() => this.$refs.searchInput.focus());
                    }
                },

                selectProfile(profile) {
                    action.smtpProfileId = profile.objectId;
                    action.senderEmail = profile.email;
                    this.isOpen = false;
                    updateActionField(index, 'smtpProfileId', profile.objectId);
                    updateActionField(index, 'senderEmail', profile.email);
                },

                filteredProfiles() {
                    if (!this.searchTerm) return $store.sequence.smtpProfiles.profiles;
                    const term = this.searchTerm.toLowerCase();
                    return $store.sequence.smtpProfiles.profiles.filter(profile =>
                        profile.name.toLowerCase().includes(term) ||
                        profile.email.toLowerCase().includes(term)
                    );
                }
            }"
                        class="relative"
                    >
                        <!-- Dropdown trigger -->
                        <div @click="toggleDropdown()" class="cursor-pointer">
                            <div
                                class="flex items-center justify-between p-2 border border-gray-300 rounded-md focus:ring-2 transition-all min-h-[42px]"
                            >
                                <span
                                    x-show="action.smtpProfileId"
                                    class="truncate"
                                >
                                    <template
                                        x-for="profile in $store.sequence.smtpProfiles.profiles"
                                        :key="profile.objectId"
                                    >
                                        <span
                                            x-show="profile.objectId === action.smtpProfileId"
                                            x-text="profile.name + ' (' + profile.email + ')'"
                                        ></span>
                                    </template>
                                </span>
                                <span
                                    x-show="!action.smtpProfileId"
                                    class="text-gray-500"
                                    >Sélectionner un profil SMTP</span
                                >
                                <i
                                    class="fas ml-2"
                                    :class="isOpen ? 'fa-chevron-up' : 'fa-chevron-down'"
                                    style="color: #9ca3af"
                                ></i>
                            </div>
                        </div>

                        <!-- Dropdown panel -->
                        <div
                            x-show="isOpen"
                            @click.away="isOpen = false"
                            x-transition:enter="transition ease-out duration-100"
                            x-transition:enter-start="transform opacity-0 scale-95"
                            x-transition:enter-end="transform opacity-100 scale-100"
                            x-transition:leave="transition ease-in duration-75"
                            x-transition:leave-start="transform opacity-100 scale-100"
                            x-transition:leave-end="transform opacity-0 scale-95"
                            class="absolute z-10 mt-1 w-full bg-white border border-gray-300 rounded-md shadow-lg max-h-60 overflow-auto focus:outline-none"
                        >
                            <!-- Search input -->
                            <div class="sticky top-0 bg-white pt-2 px-2">
                                <input
                                    type="text"
                                    x-model="searchTerm"
                                    placeholder="Rechercher un profil..."
                                    class="w-full p-2 border border-gray-200 rounded-md focus:ring-2 transition-all text-sm"
                                    x-ref="searchInput"
                                />
                            </div>

                            <!-- Profile list -->
                            <div class="py-1">
                                <template
                                    x-for="profile in filteredProfiles()"
                                    :key="profile.objectId"
                                >
                                    <div
                                        @click="selectProfile(profile)"
                                        class="flex items-center px-3 py-2 cursor-pointer hover:bg-gray-100 transition-all"
                                    >
                                        <div class="flex-1 min-w-0">
                                            <p
                                                class="text-sm font-medium text-gray-900 truncate"
                                                x-text="profile.name"
                                            ></p>
                                            <p
                                                class="text-xs text-gray-500 truncate"
                                                x-text="profile.email"
                                            ></p>
                                        </div>
                                        <i
                                            class="fas fa-check text-marki-primary ml-2"
                                            x-show="profile.objectId === action.smtpProfileId"
                                        ></i>
                                    </div>
                                </template>

                                <div
                                    x-show="filteredProfiles().length === 0"
                                    class="px-3 py-2 text-center text-gray-500 text-sm"
                                >
                                    Aucun profil SMTP trouvé
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Sender Email -->
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1"
                        >Email Expéditeur</label
                    >
                    <input
                        type="email"
                        x-model="action.senderEmail"
                        @blur="updateSenderEmail()"
                        placeholder="expéditeur@example.com"
                        class="focus:ring-2 transition-all w-full"
                    />
                    <p class="text-xs text-gray-500 mt-1">
                        Laisser vide pour utiliser l'email du profil SMTP par
                        défaut
                    </p>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1"
                        >Message</label
                    >
                    <toastui-editor-lit
                        :body="action.body"
                        @content-change="handleContentChange"
                        height="300px"
                        class="border border-gray-300 rounded"
                    >
                    </toastui-editor-lit>
                </div>
            </div>
        </div>
    </div>
</template>
