<!-- payment_links.html - Composant pour la gestion des liens de paiement -->
<div
    x-data="{
    // Utilisation du store centralisé
    get paymentLinksStore() {
        try {
            return Alpine.store('paymentLinks');
        } catch (error) {
            console.warn('paymentLinksStore not available yet:', error);
            return null;
        }
    },

    async init() {
        await this.paymentLinksStore.loadPaymentLinks();
    },

    get linksConfigOpen() {
        return this.paymentLinksStore ? this.paymentLinksStore.linksConfigOpen : false;
    },
    
    set linksConfigOpen(value) {
        if (this.paymentLinksStore) {
            this.paymentLinksStore.linksConfigOpen = value;
        }
    },

    get newLink() {
        return this.paymentLinksStore ? this.paymentLinksStore.newLink : '';
    },
    
    set newLink(value) {
        if (this.paymentLinksStore) {
            this.paymentLinksStore.newLink = value;
        }
    },

    get newLinkName() {
        return this.paymentLinksStore ? this.paymentLinksStore.newLinkName : '';
    },
    
    set newLinkName(value) {
        if (this.paymentLinksStore) {
            this.paymentLinksStore.newLinkName = value;
        }
    },

    get newLinkDescription() {
        return this.paymentLinksStore ? this.paymentLinksStore.newLinkDescription : '';
    },
    
    set newLinkDescription(value) {
        if (this.paymentLinksStore) {
            this.paymentLinksStore.newLinkDescription = value;
        }
    },

    get customMessage() {
        return this.paymentLinksStore ? this.paymentLinksStore.customMessage : '';
    },
    
    set customMessage(value) {
        if (this.paymentLinksStore) {
            this.paymentLinksStore.setCustomMessage(value);
        }
=======
    },

    openLinksConfig() {
        this.paymentLinksStore.linksConfigOpen = true;
    },

    closeLinksConfig() {
        this.paymentLinksStore.linksConfigOpen = false;
    },

    selectLink(link) {
        this.paymentLinksStore.selectLink(link.url);
        this.closeLinksConfig();
    },

    async addNewLink() {
        if (this.newLinkName.trim() === '' || this.newLink.trim() === '') return;

        try {
            const newLink = await this.paymentLinksStore.addPaymentLink({
                url: this.newLink,
                name: this.newLinkName,
                description: this.newLinkDescription
            });

            if (newLink) {
                this.newLink = '';
                this.newLinkName = '';
                this.newLinkDescription = '';
            }
        } catch (error) {
            console.error('Error saving payment link:', error);
            alert('Erreur lors de la sauvegarde du lien de paiement. Veuillez réessayer.');
        }
    }
}"
    class="payment-links-container mb-4"
>
    <!-- Header des liens de paiement avec toggle -->
    <div class="flex flex-wrap items-center justify-between mb-3">
        <div class="flex items-center">
            <input
                id="paymentLinkSwitch"
                type="checkbox"
                name="switch"
                class="hidden"
                :checked="paymentLinksStore.showLink"
            />

            <button
                type="button"
                @click="paymentLinksStore.toggleShowLink()"
                :class="paymentLinksStore.showLink ? 'bg-blue-600' : 'bg-neutral-200'"
                class="relative inline-flex h-6 py-0.5 ml-4 focus:outline-none rounded-full w-10"
                x-cloak
            >
                <span
                    :class="paymentLinksStore.showLink ? 'translate-x-[18px]' : 'translate-x-0.5'"
                    class="w-5 h-5 duration-200 ease-in-out bg-white rounded-full shadow-md"
                ></span>
            </button>

            <label
                @click="$refs.switchButton.click(); $refs.switchButton.focus()"
                :id="$id('switch')"
                :class="{ 'text-blue-600': paymentLinksStore.showLink, 'text-gray-400': !paymentLinksStore.showLink }"
                class="text-sm select-none ml-3"
                x-cloak
            >
                Inclure le lien de paiement
            </label>
        </div>
        <div class="flex items-center">
            <button
                @click="openLinksConfig()"
                class="text-sm text-blue-600 hover:text-blue-800"
            >
                <i class="fa-regular fa-link mr-1"></i>
                <span>Gérer les liens</span>
            </button>
        </div>
    </div>

    <!-- Affichage du lien sélectionné -->
    <div
        x-show="paymentLinksStore.showLink"
        x-transition
        class="bg-white border border-gray-200 rounded-lg p-4 shadow-sm"
    >
        <div>
            <div class="mb-4">
                <textarea
                    x-model="customMessage"
                    class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-marki-primary focus:border-transparent"
                    rows="3"
                    placeholder="Message personnalisé pour accompagner le lien de paiement..."
                ></textarea>
            </div>

            <div class="mb-4 p-3 bg-gray-50 rounded">
                <p class="text-sm text-gray-700" x-text="customMessage"></p>
            </div>

            <p class="mb-3">
                <strong>Lien de paiement :</strong>
            </p>
            <div class="flex">
                <div class="flex-1">
                    <input
                        type="text"
                        :value="paymentLinksStore.selectedLink"
                        class="w-full border border-gray-300 rounded px-2 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-marki-primary focus:border-transparent"
                        readonly
                    />
                </div>
                <div class="ml-2">
                    <button
                        @click="navigator.clipboard.writeText(paymentLinksStore.selectedLink).then(() => alert('Lien copié!'))"
                        class="bg-blue-500 text-white px-2 py-1 rounded text-sm hover:bg-blue-600"
                    >
                        <span class="text-sm">
                            <i class="fa-regular fa-copy"></i>
                        </span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Template de gestion des liens (inline) -->
    <template x-if="paymentLinks.linksConfigOpen">
        <div
            x-show="paymentLinks.linksConfigOpen"
            x-transition
            class="mb-4 p-4 bg-gray-50 rounded-lg border border-gray-200"
        >
        <div class="bg-white rounded-lg shadow-xl w-full max-w-md mx-4">
            <header
                class="border-b border-gray-200 p-4 flex justify-between items-center"
            >
                <p class="text-lg font-semibold">
                    Gestion des liens de paiement
                </p>
                <button
                    @click="closeLinksConfig()"
                    class="text-gray-400 hover:text-gray-600"
                    aria-label="close"
                >
                    <i class="fa-regular fa-times text-xl"></i>
                </button>
            </header>
            <section class="p-4">
                <div>
                    <!-- Ajout d'un nouveau lien -->
                    <div class="mb-4">
                        <label
                            class="block text-sm font-medium text-gray-700 mb-1"
                            >Nom du lien</label
                        >
                        <div>
                            <input
                                type="text"
                                x-model="paymentLinks.newLinkName"
                                class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-marki-primary focus:border-transparent"
                                placeholder="Ex: Paiement CB, Prélèvement SEPA, etc."
                            />
                        </div>
                        <p class="text-xs text-gray-500 mt-1">
                            Nom descriptif pour identifier le lien
                        </p>
                    </div>

                    <div class="mb-4">
                        <label
                            class="block text-sm font-medium text-gray-700 mb-1"
                            >URL du lien</label
                        >
                        <div>
                            <input
                                type="url"
                                x-model="paymentLinks.newLink"
                                class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-marki-primary focus:border-transparent"
                                placeholder="https://votre-lien-de-paiement.com"
                            />
                        </div>
                        <p class="text-xs text-gray-500 mt-1">
                            Saisissez l'URL complète du lien de paiement
                        </p>
                    </div>

                    <div class="mb-4">
                        <label
                            class="block text-sm font-medium text-gray-700 mb-1"
                            >Description (optionnelle)</label
                        >
                        <div>
                            <textarea
                                x-model="paymentLinks.newLinkDescription"
                                class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-marki-primary focus:border-transparent"
                                placeholder="Description supplémentaire du lien de paiement"
                                rows="2"
                            ></textarea>
                        </div>
                        <p class="text-xs text-gray-500 mt-1">
                            Informations supplémentaires sur ce lien
                        </p>
                    </div>

                    <button
                        @click="await addNewLink()"
                        class="bg-marki-primary text-white px-4 py-2 rounded hover:bg-marki-primary-dark mb-5"
                        :disabled="!paymentLinks.newLink.trim() || !paymentLinks.newLinkName.trim()"
                    >
                        <span class="text-sm mr-1">
                            <i class="fa-regular fa-plus"></i>
                        </span>
                        <span>Ajouter le lien</span>
                    </button>

                    <!-- Liste des liens existants -->
                    <h5 class="text-lg font-bold mb-3">Liens disponibles</h5>
                    <div
                        class="bg-white border border-gray-200 rounded-lg p-4 shadow-sm"
                    >
                        <template
                            x-for="link in paymentLinksStore.links"
                            :key="link.objectId"
                        >
                            <div
                                class="mb-3 pb-3"
                                style="border-bottom: 1px solid #eee"
                            >
                                <div
                                    class="flex flex-wrap items-center justify-between"
                                >
                                    <div class="flex-1">
                                        <div>
                                            <p class="mb-1">
                                                <strong
                                                    x-text="link.name"
                                                ></strong>
                                            </p>
                                            <p
                                                class="text-sm text-gray-500 mb-1"
                                                x-text="link.url"
                                            ></p>
                                            <p
                                                class="text-xs text-gray-400 italic"
                                                x-text="link.description"
                                                x-show="link.description"
                                            ></p>
                                        </div>
                                    </div>
                                    <div class="flex-shrink-0">
                                        <button
                                            @click="selectLink(link)"
                                            class="bg-blue-500 text-white px-3 py-1 rounded text-sm hover:bg-blue-600"
                                        >
                                            Sélectionner
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </template>

                        <div
                            x-show="paymentLinksStore.links.length === 0"
                            class="text-center"
                        >
                            <p class="text-gray-500">
                                Aucun lien de paiement disponible
                            </p>
                        </div>
                    </div>
                </div>
            </section>
            <footer class="border-t border-gray-200 p-4">
                <button
                    @click="paymentLinks.linksConfigOpen = false"
                    class="bg-white border border-gray-300 text-gray-700 px-4 py-2 rounded hover:bg-gray-50"
                >
                    Fermer
                </button>
            </footer>
        </div>
    </template>
</div>
