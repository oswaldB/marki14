<!-- impayes_summary_table.html - Composant pour le tableau récapitulatif des impayés -->
<div
    class="impayes-summary-table"
    x-data="{
    showColumnSettings: false,
    visibleColumns: ['nfacture', 'payeur_nom', 'montant', 'date', 'statut_intitule'],
    allColumns: [],
    columnLabels: {},
    loading: false,
    error: null,
    init() {
        this.loadColumnConfig();
    },
    async loadColumnConfig() {
        this.loading = true;
        this.error = null;
        try {
            const response = await fetch('/static/configs/variables.json');
            if (!response.ok) {
                throw new Error('Failed to load column configuration');
            }
            const config = await response.json();
            this.allColumns = config.columns || [];

            // No need for columnLabels anymore, we'll use raw column names
            this.columnLabels = {};
        } catch (err) {
            console.error('Error loading column config:', err);
            this.error = 'Failed to load column configuration. Using defaults.';
            // Fallback to default columns
            this.allColumns = ['nfacture', 'payeur_nom', 'montant', 'date', 'statut_intitule', 'refpiece', 'payeur_email', 'payeur_telephone'];
        } finally {
            this.loading = false;
        }
    },
    getColumnLabel(column) {
        return column;
    },
    isColumnVisible(column) {
        return this.visibleColumns.includes(column);
    },
    moveColumnUp(column) {
        const index = this.visibleColumns.indexOf(column);
        if (index > 0) {
            this.visibleColumns.splice(index, 1);
            this.visibleColumns.splice(index - 1, 0, column);
        }
    },
    moveColumnDown(column) {
        const index = this.visibleColumns.indexOf(column);
        if (index < this.visibleColumns.length - 1) {
            this.visibleColumns.splice(index, 1);
            this.visibleColumns.splice(index + 1, 0, column);
        }
    },
    addColumn(column) {
        if (!this.visibleColumns.includes(column)) {
            this.visibleColumns.push(column);
        }
    },
    removeColumn(column) {
        this.visibleColumns = this.visibleColumns.filter(c => c !== column);
    }
}"
>
    <div class="mb-2">
        <button
            @click="showColumnSettings = !showColumnSettings"
            class="text-sm text-blue-600 hover:text-blue-800"
            :disabled="loading"
        >
            <i class="fa-regular fa-cog mr-1"></i>
            <span
                x-text="loading ? 'Chargement...' : 'Personnaliser les colonnes'"
            ></span>
        </button>
        <div
            x-show="error"
            class="text-sm text-red-500 mt-1"
            x-text="error"
        ></div>
    </div>

    <div
        x-show="showColumnSettings"
        x-transition
        class="mb-4 p-4 bg-gray-50 rounded-lg border border-gray-200"
    >
        <h4 class="font-medium text-sm mb-2">Personnalisation des colonnes</h4>
        <div class="space-y-3">
            <div>
                <h5 class="text-sm font-medium mb-1">
                    Colonnes visibles (glisser-déposer pour réorganiser) :
                </h5>
                <div class="flex flex-wrap gap-2 max-h-48 overflow-y-auto">
                    <template x-for="column in visibleColumns" :key="column">
                        <div
                            class="flex items-center space-x-1 bg-white px-2 py-1 rounded border shadow-sm"
                        >
                            <span
                                x-text="getColumnLabel(column)"
                                class="text-sm"
                            ></span>
                            <button
                                @click="moveColumnUp(column)"
                                class="text-xs text-gray-500 hover:text-gray-700"
                                title="Monter"
                            >
                                <i class="fa-regular fa-arrow-up"></i>
                            </button>
                            <button
                                @click="moveColumnDown(column)"
                                class="text-xs text-gray-500 hover:text-gray-700"
                                title="Descendre"
                            >
                                <i class="fa-regular fa-arrow-down"></i>
                            </button>
                            <button
                                @click="removeColumn(column)"
                                class="text-xs text-red-500 hover:text-red-700"
                                title="Supprimer"
                            >
                                <i class="fa-regular fa-times"></i>
                            </button>
                        </div>
                    </template>
                </div>
            </div>
            <div>
                <h5 class="text-sm font-medium mb-1">Colonnes disponibles :</h5>
                <div class="flex flex-wrap gap-2">
                    <template x-for="column in allColumns" :key="column">
                        <template x-if="!visibleColumns.includes(column)">
                            <button
                                @click="addColumn(column)"
                                class="text-sm text-blue-600 hover:text-blue-800 px-2 py-1"
                            >
                                <i class="fa-regular fa-plus mr-1"></i>
                                <span x-text="getColumnLabel(column)"></span>
                            </button>
                        </template>
                    </template>
                </div>
            </div>
        </div>
    </div>

    <div class="overflow-x-auto max-w-full">
        <div class="min-w-max">
            <table class="w-full">
                <thead class="bg-gray-50">
                    <tr>
                        <template
                            x-for="column in visibleColumns"
                            :key="column"
                        >
                            <th
                                class="text-left p-2 font-semibold text-sm text-gray-700 whitespace-nowrap"
                                x-text="getColumnLabel(column)"
                            ></th>
                        </template>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-200">
                    <template
                        x-for="impaye in associatedImpayes"
                        :key="impaye.objectId"
                    >
                        <tr>
                            <template
                                x-for="column in visibleColumns"
                                :key="`${impaye.objectId}-${column}`"
                            >
                                <td
                                    class="p-2"
                                    :class="column === 'payeur_nom' || column === 'statut_intitule' || column === 'refpiece' ? 'truncate max-w-xs' : 'whitespace-nowrap'"
                                    x-text="column === 'montant' ? formatCurrency(impaye[column]) : column === 'date' ? formatDate(impaye[column]) : impaye[column]"
                                ></td>
                            </template>
                        </tr>
                    </template>
                    <tr x-show="associatedImpayes.length === 0">
                        <td
                            :colspan="visibleColumns.length"
                            class="text-center p-4 text-gray-500"
                        >
                            Aucun impayé associé à cette séquence.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
