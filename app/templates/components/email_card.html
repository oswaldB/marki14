<!-- email_card_lit.html - Lit-based version with Froala web component -->
<div x-data="{
    action: action,
    index: index,
    deleteConfirmOpen: false,
    toastuiEditor: null,
    
    init() {
        // Setup editor when component is ready
        this.$nextTick(() => {
            if (this.$refs.toastuiEditor) {
                this.toastuiEditor = this.$refs.toastuiEditor;
                this.setupEditor();
            }
        });
    },
    
    setupEditor() {
        if (this.toastuiEditor && this.action.body) {
            try {
                this.toastuiEditor.setContent(this.action.body);
            } catch (error) {
                console.warn('Error setting editor content:', error);
            }
        }
        
        // Listen for save events to sync content
        document.addEventListener('before-save', () => {
            this.syncEditorContent();
        });
    },
    
    syncEditorContent() {
        if (this.toastuiEditor) {
            try {
                const content = this.toastuiEditor.getContent();
                if (content && content !== this.action.body) {
                    this.action.body = content;
                }
            } catch (error) {
                console.warn('Error syncing editor content:', error);
            }
        }
    },
    
    editAction() {
        console.log('Editing action', this.index);
    },
    
    deleteAction() {
        this.deleteConfirmOpen = true;
    },
    
    confirmDelete() {
        this.$dispatch('delete-action', { index: this.index });
        this.deleteConfirmOpen = false;
    },
    
    cancelDelete() {
        this.deleteConfirmOpen = false;
    }
}" class="email-card-container">
    <!-- Step Component -->
    <div
        class="bg-white border border-gray-200 rounded-lg shadow-sm p-4 mb-4"
        x-show="action.type === 'email'"
    >
        <div class="flex flex-wrap items-center justify-between gap-4">
            <div>
                <h3 class="text-lg font-semibold text-gray-900">
                    Step <span x-text="index + 1"></span>: Email
                </h3>
            </div>
            <div class="flex gap-2">
                <button
                    @click="editAction()"
                    class="bg-blue-500 text-white px-3 py-1 rounded text-sm hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
                >
                    <span class="mr-1">
                        <i class="fa-regular fa-edit"></i>
                    </span>
                    <span>Edit</span>
                </button>
                <button
                    @click="deleteAction()"
                    class="bg-red-500 text-white px-3 py-1 rounded text-sm hover:bg-red-600 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2"
                >
                    <span class="mr-1">
                        <i class="fa-regular fa-trash-alt"></i>
                    </span>
                    <span>Delete</span>
                </button>
            </div>
        </div>

        <!-- Email Configuration -->
        <div class="mt-4 space-y-4">
            <!-- Delay -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1"
                    >Delay (days)</label
                >
                <div>
                    <input
                        type="number"
                        x-model="action.delay"
                        class="w-full p-2 border border-gray-300 rounded-md focus:ring-marki-primary focus:border-marki-primary"
                        min="0"
                        placeholder="0"
                    />
                </div>
                <p class="text-xs text-gray-500 mt-1">
                    Number of days before sending this email in the sequence
                </p>
            </div>

            <!-- SMTP Profile Selector -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1"
                    >SMTP Profile</label
                >
                <div x-data="{
                    get sequenceStore() {
                        try {
                            return Alpine.store('sequence');
                        } catch (error) {
                            console.warn('sequenceStore not available:', error);
                            return null;
                        }
                    },
                    
                    get profiles() {
                        return this.sequenceStore ? this.sequenceStore.smtpProfiles.profiles : [];
                    },
                    
                    get selectedProfileId() {
                        return action.smtpProfileId;
                    },
                    
                    set selectedProfileId(value) {
                        action.smtpProfileId = value;
                        // Mettre à jour l'email de l'expéditeur
                        if (this.sequenceStore) {
                            const profile = this.profiles.find(p => p.objectId === value);
                            if (profile) {
                                action.senderEmail = profile.email;
                            }
                        }
                    }
                }">
                    <!-- Grille de sélection simplifiée -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                        <template x-for="profile in profiles" :key="profile.objectId">
                            <label class="flex items-center p-2 border rounded cursor-pointer hover:bg-gray-50">
                                <input
                                    type="radio"
                                    name="smtpProfile"
                                    :value="profile.objectId"
                                    x-model="selectedProfileId"
                                    class="mr-2"
                                >
                                <div class="flex-1">
                                    <p class="font-medium text-sm" x-text="profile.name"></p>
                                    <p class="text-xs text-gray-600" x-text="profile.email"></p>
                                </div>
                            </label>
                        </template>
                    </div>
                    <p
                        class="text-xs text-yellow-600 mt-1"
                        x-show="!selectedProfileId"
                    >
                        <span class="mr-1">
                            <i class="fa-regular fa-exclamation-triangle"></i>
                        </span>
                        Please select an SMTP profile for sending
                    </p>
                </div>
            </div>

            <!-- Sender -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1"
                    >Sender</label
                >
                <div>
                    <input
                        type="email"
                        x-model="action.senderEmail"
                        class="w-full p-2 border border-gray-300 rounded-md text-sm focus:ring-marki-primary focus:border-marki-primary"
                        placeholder="email@example.com"
                    />
                </div>
                <p class="text-xs text-gray-500 mt-1">
                    Leave empty to use the default SMTP profile email
                </p>
            </div>

            <!-- Subject -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1"
                    >Subject</label
                >
                <div>
                    <input
                        type="text"
                        x-model="action.subject"
                        class="w-full p-2 border border-gray-300 rounded-md focus:ring-marki-primary focus:border-marki-primary"
                        placeholder="Email subject..."
                    />
                </div>
            </div>

            <!-- ToastUI Editor - Full width without variables column -->
            <div class="mt-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Email Content
                </label>

                <!-- ToastUI Editor Symbiote Component -->
                <toastui-editor-symbiote
                    x-ref="toastuiEditor"
                    class="mb-4"
                    content="action.body"
                    @content-change="action.body = $event.detail.content"
                ></toastui-editor-symbiote>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Drawer -->
    <div
        x-show="deleteConfirmOpen"
        class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50"
    >
        <div class="bg-white rounded-lg shadow-xl w-full max-w-md mx-4">
            <div
                class="flex items-center justify-between p-4 border-b border-gray-200"
            >
                <h3 class="text-lg font-medium text-gray-900 flex items-center">
                    <span class="mr-2 text-red-500">
                        <i class="fa-regular fa-exclamation-triangle"></i>
                    </span>
                    Delete Confirmation
                </h3>
                <button
                    @click="cancelDelete()"
                    class="text-gray-400 hover:text-gray-600 focus:outline-none"
                    aria-label="close"
                >
                    <i class="fa-regular fa-times text-xl"></i>
                </button>
            </div>
            <div class="p-4">
                <div>
                    <p class="text-gray-700">
                        Are you sure you want to delete this step?
                    </p>
                    <p class="text-sm text-gray-500 mt-1">
                        This action is irreversible.
                    </p>
                </div>
            </div>
            <div class="flex justify-end p-4 border-t border-gray-200">
                <button
                    @click="confirmDelete()"
                    class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2 mr-2"
                >
                    <span class="mr-1">
                        <i class="fa-regular fa-trash-alt"></i>
                    </span>
                    <span>Delete</span>
                </button>
                <button
                    @click="cancelDelete()"
                    class="bg-gray-200 text-gray-700 px-4 py-2 rounded hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2"
                >
                    Cancel
                </button>
            </div>
        </div>
    </div>
</div>
