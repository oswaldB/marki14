<!-- components/impayes-view-selector.html -->
<div class="bg-white border border-gray-200 rounded-lg p-4 shadow-sm mb-4">
    <div class="flex flex-wrap gap-4 items-center">
        <span class="text-sm font-medium text-gray-700 mr-4">Mode d'affichage :</span>
        
        <div class="flex flex-wrap gap-2">
            <button
                @click="$store.impayesStore.switchView('payeur')"
                :class="{
                    'bg-marki-primary text-white': $store.impayesStore.currentView === 'payeur',
                    'bg-white text-gray-700 border border-gray-300 hover:bg-gray-50': $store.impayesStore.currentView !== 'payeur'
                }"
                class="px-4 py-2 rounded text-sm font-medium transition-colors"
            >
                Groupé par payeur
            </button>
            
            <button
                @click="$store.impayesStore.switchView('facture')"
                :class="{
                    'bg-marki-primary text-white': $store.impayesStore.currentView === 'facture',
                    'bg-white text-gray-700 border border-gray-300 hover:bg-gray-50': $store.impayesStore.currentView !== 'facture'
                }"
                class="px-4 py-2 rounded text-sm font-medium transition-colors"
            >
                Groupé par facture
            </button>
            
            <button
                @click="$store.impayesStore.switchView('acteur')"
                :class="{
                    'bg-marki-primary text-white': $store.impayesStore.currentView === 'acteur',
                    'bg-white text-gray-700 border border-gray-300 hover:bg-gray-50': $store.impayesStore.currentView !== 'acteur'
                }"
                class="px-4 py-2 rounded text-sm font-medium transition-colors"
            >
                Groupé par acteur
            </button>
            

        </div>
    </div>
</div>
