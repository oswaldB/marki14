<!-- components/impayes-header.html -->
<div class="bg-white border border-gray-200 rounded-lg p-4 shadow-sm mb-4">
    <div class="flex flex-wrap items-center justify-between">
        <div class="flex-1 min-w-0 mb-4 md:mb-0">
            <div>
                <h1 class="text-2xl font-bold">Impayés</h1>
                <p class="text-sm text-gray-600">
                    <span x-text="$store.impayesStore.getFilteredData().length"></span> facture(s)
                    impayée(s)
                </p>
            </div>
        </div>
        <div class="flex-shrink-0">
            <button
                @click="$store.impayesStore.refreshData()"
                :disabled="$store.impayesStore.isLoading"
                class="bg-marki-primary text-white px-4 py-2 rounded hover:bg-marki-primary-dark disabled:opacity-50 disabled:cursor-not-allowed"
            >
                <i x-show="!$store.impayesStore.isLoading" class="fa-regular fa-sync mr-2"></i>
                <i
                    x-show="$store.impayesStore.isLoading"
                    class="fa-regular fa-spinner fa-spin mr-2"
                ></i>
                Rafraîchir
            </button>
        </div>
    </div>
</div>
