<!-- components/impayes-item-card.html -->
<div
    class="bg-gray-50 border border-gray-200 rounded-lg p-4 mb-4"
>
    <div
        class="flex flex-wrap items-center justify-between"
    >
        <div
            class="flex-1 min-w-0 mb-4 md:mb-0"
        >
            <div class="flex items-center">
                <!-- Case à cocher pour la sélection multiple -->
                <div class="mr-3">
                    <input
                        type="checkbox"
                        x-model="$store.impayesStore.selectedImpayes"
                        :value="impaye.objectId"
                        @change="$store.impayesStore.isBulkMode = $store.impayesStore.selectedImpayes.length > 0"
                        class="h-4 w-4 text-blue-600 border-gray-300 rounded"
                    >
                </div>
                <div class="mr-3">
                    <span
                        class="inline-block px-2 py-1 rounded text-xs font-medium"
                        :class="impaye.facturesoldee ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'"
                    >
                        <span
                            x-text="impaye.facturesoldee ? 'Soldée' : 'Impayée'"
                        ></span>
                    </span>
                </div>
                <div class="flex-1 min-w-0">
                    <p
                        class="text-lg font-medium"
                        x-text="impaye.refpiece"
                    ></p>
                    <p
                        class="text-sm text-gray-600"
                    >
                        N°
                        <span
                            x-text="impaye.nfacture"
                        ></span>
                        -
                        <span
                            x-text="$store.impayesStore.formatDate(impaye.datepiece)"
                        ></span>
                    </p>
                    <p
                        class="text-sm text-gray-600"
                    >
                        Dossier: 
                        <span
                            x-text="impaye.numero || 'N/A'"
                        ></span>
                    </p>
                    <p
                        class="text-sm text-gray-500"
                    >
                        <i
                            class="fa-regular fa-location-dot mr-1"
                        ></i>
                        <span
                            x-text="(impaye.numVoie || '') + ' ' + (impaye.typeVoie || '') + ' ' + (impaye.cptNumVoie || '') + ' ' + (impaye.adresse || '') + ', ' + (impaye.codepostal || '') + ' ' + (impaye.ville || '')"
                        ></span>
                    </p>
                    
                    <!-- Affichage des séquences pour la facture (supprimé) -->
                </div>
            </div>
        </div>
        <div class="flex-shrink-0 text-right">
            <p
                class="text-lg font-bold"
                x-text="$store.impayesStore.formatCurrency(impaye.totalttcnet)"
            ></p>
            <p class="text-sm text-gray-600">
                Reste:
                <span
                    x-text="$store.impayesStore.formatCurrency(impaye.resteapayer)"
                ></span>
            </p>
        </div>
    </div>

    <!-- Actions -->
    <div
        class="flex justify-start space-x-2 mt-3"
    >
        <!-- Bouton ajouter à une séquence supprimé -->
        <button
            x-show="impaye.invoice_url"
            @click="$store.impayesStore.openInvoice(impaye.invoice_url)"
            class="bg-blue-500 text-white px-3 py-1 rounded text-sm hover:bg-blue-600"
        >
            <i
                class="fa-regular fa-eye mr-1"
            ></i>
            Voir la facture
        </button>
        <button
            @click="$store.impayesStore.openDetailsDrawer(impaye)"
            class="bg-gray-500 text-white px-3 py-1 rounded text-sm hover:bg-gray-600"
        >
            Détails
        </button>
    </div>
</div>
