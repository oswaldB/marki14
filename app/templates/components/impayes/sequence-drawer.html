<!-- components/impayes/sequence-drawer.html -->
<div
    x-show="$store.impayesStore.isSequenceDrawerOpen"
    x-transition:enter="transition ease-out duration-300"
    x-transition:enter-start="translate-x-full"
    x-transition:enter-end="translate-x-0"
    x-transition:leave="transition ease-in duration-200"
    x-transition:leave-start="translate-x-0"
    x-transition:leave-end="translate-x-full"
    class="fixed inset-y-0 right-0 w-[480px] bg-white border-l border-gray-200 shadow-xl z-[100] flex flex-col overflow-y-auto"
    style="background-color: white !important; border-left: 1px solid #e5e7eb !important;"
>
    <header
        class="bg-gray-100 border-b border-gray-200 rounded-t-lg px-4 py-3 flex justify-between items-center"
        x-init="console.log('Drawer sequence rendu'); console.log('isSequenceDrawerOpen:', $store.impayesStore.isSequenceDrawerOpen)"
    >
        <h3 class="text-lg font-medium text-gray-900">
            Ajouter à une séquence (<span x-text="$store.impayesStore.selectedImpayes.length"></span>)
        </h3>
        <button
            @click="$store.impayesStore.closeSequenceDrawer()"
            class="text-gray-400 hover:text-gray-600 focus:outline-none"
            aria-label="close"
        >
            <i class="fa-regular fa-times"></i>
        </button>
    </header>

    <!-- Content -->
    <section class="p-4 flex-1 overflow-y-auto">
        <div class="mb-6">
            <h4 class="text-sm font-medium text-gray-600 mb-3">
                Sélectionner une séquence existante
            </h4>
            <div class="space-y-2 max-h-64 overflow-y-auto">
                <template x-for="sequence in $store.impayesStore.availableSequences" :key="sequence.id">
                    <label class="flex items-center p-2 rounded border border-gray-200 hover:bg-gray-50 cursor-pointer">
                        <input
                            type="radio"
                            name="sequence"
                            x-model="$store.impayesStore.selectedSequenceForAdd"
                            :value="sequence.id"
                            class="h-4 w-4 text-marki-primary border-gray-300"
                        >
                        <span class="ml-3 text-sm text-gray-700" x-text="sequence.name || sequence.nom"></span>
                    </label>
                </template>
                
                <template x-if="$store.impayesStore.availableSequences.length === 0">
                    <p class="text-sm text-gray-500 italic">Aucune séquence existante</p>
                </template>
            </div>
        </div>

        <div class="mb-6">
            <h4 class="text-sm font-medium text-gray-600 mb-3">
                Ou créer une nouvelle séquence
            </h4>
            <input
                type="text"
                x-model="$store.impayesStore.newSequenceName"
                placeholder="Nom de la nouvelle séquence"
                class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-marki-primary focus:border-transparent"
            >
        </div>

        <div class="bg-gray-50 border-t border-gray-200 rounded-b-lg px-4 py-3 flex justify-between items-center">
            <span class="text-sm text-gray-600">
                <span x-text="$store.impayesStore.selectedImpayes.length"></span> facture(s) sélectionnée(s)
            </span>
            <button
                @click="$store.impayesStore.addToSequence()"
                class="bg-marki-primary text-white px-4 py-2 rounded hover:bg-marki-primary-dark disabled:opacity-50"
                :disabled="!$store.impayesStore.selectedSequenceForAdd && !$store.impayesStore.newSequenceName"
            >
                <i class="fa-regular fa-plus mr-2"></i>
                Ajouter à la séquence
            </button>
        </div>
    </section>
</div>
