<!-- components/impayes-filters.html -->
<div class="bg-white border border-gray-200 rounded-lg p-4 shadow-sm mb-4">
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <div>
            <div class="mb-2">
                <label class="block text-sm font-medium text-gray-700 mb-1"
                    >Recherche</label
                >
                <div>
                    <input
                        type="text"
                        x-model="$store.impayesStore.filters.searchTerm"
                        @input="$store.impayesStore.filters.searchTerm = $event.target.value"
                        placeholder="Rechercher par payeur, référence, montant..."
                        class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-marki-primary focus:border-transparent"
                    />
                </div>
            </div>
        </div>
        <div>
            <div class="mb-2">
                <label class="block text-sm font-medium text-gray-700 mb-1"
                    >Payeur</label
                >
                <div>
                    <select
                        x-model="$store.impayesStore.filters.selectedPayeur"
                        @change="$store.impayesStore.filterImpayes()"
                        class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-marki-primary focus:border-transparent"
                    >
                        <option value="">Tous les payeurs</option>
                        <template x-for="payeur in $store.impayesStore.payeurs" :key="payeur">
                            <option
                                :value="payeur"
                                x-text="payeur"
                            ></option>
                        </template>
                    </select>
                </div>
            </div>
        </div>
        <div>
            <div class="mb-2">
                <label class="block text-sm font-medium text-gray-700 mb-1"
                    >Trier par</label
                >
                <div class="relative">
                    <select
                        x-model="currentSortField"
                        @change="$store.impayesStore.updateSortDescriptor(currentSortField)"
                        :disabled="$store.impayesStore.isSorting"
                        class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-marki-primary focus:border-transparent transition-all duration-200"
                        :class="{
                            'bg-gray-100 cursor-not-allowed': $store.impayesStore.isSorting,
                            'pr-10': $store.impayesStore.isSorting,
                            'border-marki-primary ring-1 ring-marki-primary': $store.impayesStore.sortDescriptors.length > 0
                        }"
                        x-init="$el.style.setProperty('--tw-ring-color', 'var(--color-marki-primary)')"
                    >
                        <option value="datepiece" :class="$store.impayesStore.sortDescriptors[0]?.field === 'datepiece' ? 'bg-marki-primary text-white' : ''">Date de facture</option>
                        <option value="delais" :class="$store.impayesStore.sortDescriptors[0]?.field === 'delais' ? 'bg-marki-primary text-white' : ''">Délais (jours)</option>
                        <option value="totalttcnet" :class="$store.impayesStore.sortDescriptors[0]?.field === 'totalttcnet' ? 'bg-marki-primary text-white' : ''">Montant TTC</option>
                        <option value="payeur_nom" :class="$store.impayesStore.sortDescriptors[0]?.field === 'payeur_nom' ? 'bg-marki-primary text-white' : ''">Payeur</option>
                        <option value="refpiece" :class="$store.impayesStore.sortDescriptors[0]?.field === 'refpiece' ? 'bg-marki-primary text-white' : ''">Référence</option>
                    </select>
                    
                    <!-- Spinner de chargement -->
                    <div
                        x-show="$store.impayesStore.isSorting"
                        x-transition
                        class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none"
                    >
                        <div
                            class="w-4 h-4 border-2 border-marki-primary border-t-transparent rounded-full animate-spin"
                        ></div>
                    </div>
                    
                    <!-- Bouton d'inversion de tri -->
                    <button
                        @click="$store.impayesStore.toggleSortDirection()"
                        :disabled="$store.impayesStore.isSorting"
                        class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 hover:text-marki-primary transition-colors duration-200"
                        :class="{ 'pr-8': $store.impayesStore.isSorting }"
                        aria-label="Inverser l'ordre de tri"
                    >
                        <i
                            class="fa-regular text-sm"
                            :class="$store.impayesStore.sortDescriptors[0]?.direction === 'asc' ? 'fa-arrow-up' : 'fa-arrow-down'"
                        ></i>
                    </button>
                </div>
            </div>
        </div>
        <div>
            <div class="mb-2">
                <label class="block text-sm font-medium text-gray-700 mb-1"
                    >Séquences</label
                >
                <div>
                    <select
                        x-model="$store.impayesStore.filters.sequenceFilter"
                        @change="$store.impayesStore.filterImpayes()"
                        class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-marki-primary focus:border-transparent"
                    >
                        <option value="all">Toutes les séquences</option>
                        <option value="with-sequence">Avec séquence</option>
                        <option value="without-sequence">Pas de séquence attribuée</option>
                    </select>
                </div>
            </div>
        </div>
    </div>
</div>
