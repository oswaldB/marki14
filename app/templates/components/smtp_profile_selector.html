<!-- smtp_profile_selector.html - Composant pour la sélection des profils SMTP -->
<div
    x-data="{
        // Utilisation du store centralisé
        get sequenceStore() {
            return Alpine.store('sequence');
        },

        get profiles() {
            return this.sequenceStore.smtpProfiles.profiles;
        },

        get selectedProfile() {
            return this.sequenceStore.smtpProfiles.selectedProfile;
        },

        get isLoading() {
            return this.sequenceStore.smtpProfiles.isLoading;
        },

        get error() {
            return this.sequenceStore.smtpProfiles.error;
        },

        // Méthodes
        selectProfile(profileId) {
            this.sequenceStore.selectSmtpProfile(profileId);
        },

        async refreshProfiles() {
            await this.sequenceStore.loadSmtpProfiles();
        }
    }"
    class="smtp-profile-selector"
>
    <!-- En-tête -->
    <div class="flex flex-wrap items-center justify-between mb-4">
        <h4 class="text-lg font-bold text-gray-900">
            <span class="text-marki-primary text-sm mr-2">
                <i class="fa-regular fa-envelope"></i>
            </span>
            Profil SMTP
        </h4>
        <button
            @click="refreshProfiles()"
            :disabled="isLoading"
            class="bg-marki-primary text-white px-3 py-1 rounded hover:bg-marki-primary-dark disabled:opacity-50 disabled:cursor-not-allowed text-sm"
        >
            <i class="fa-regular fa-sync mr-1"></i>
            <span x-show="!isLoading">Actualiser</span>
            <span x-show="isLoading">
                <i class="fa-regular fa-spinner fa-spin"></i>
            </span>
        </button>
    </div>

    <!-- Message de chargement -->
    <div x-show="isLoading" class="text-center py-4">
        <i class="fa-regular fa-spinner fa-spin text-marki-primary text-xl"></i>
        <p class="text-sm text-gray-500 mt-2">Chargement des profils SMTP...</p>
    </div>

    <!-- Message d'erreur -->
    <div
        x-show="error && !isLoading"
        class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4 text-sm"
    >
        <button
            @click="error = null"
            class="text-gray-400 hover:text-gray-600 ml-2 float-right"
        >
            <i class="fa-regular fa-times"></i>
        </button>
        <span x-text="error"></span>
    </div>

    <!-- Message si aucun profil -->
    <div
        x-show="!isLoading && profiles.length === 0"
        class="bg-yellow-50 border border-yellow-200 text-yellow-700 px-4 py-3 rounded text-sm"
    >
        <i class="fa-regular fa-exclamation-triangle mr-2"></i>
        Aucun profil SMTP configuré. Veuillez en ajouter un dans les paramètres.
    </div>

    <!-- Grille de sélection des profils -->
    <div
        x-show="!isLoading && profiles.length > 0"
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3"
    >
        <template x-for="profile in profiles" :key="profile.objectId">
            <div
                @click="selectProfile(profile.objectId)"
                class="bg-white border-2 rounded-lg p-3 cursor-pointer hover:shadow-md transition-all"
                :class="{
                    'border-marki-primary': selectedProfile && selectedProfile.objectId === profile.objectId,
                    'border-gray-200': !(selectedProfile && selectedProfile.objectId === profile.objectId)
                }"
            >
                <div class="flex items-start">
                    <div class="flex-1">
                        <h5 class="font-medium text-gray-900 mb-1" x-text="profile.name"></h5>
                        <p class="text-sm text-gray-600 mb-2" x-text="profile.email"></p>
                        <div class="flex flex-wrap gap-2 text-xs">
                            <span
                                class="bg-gray-100 text-gray-700 px-2 py-1 rounded"
                                x-text="profile.server + ':' + profile.port"
                            ></span>
                            <span
                                x-show="profile.useSSL"
                                class="bg-blue-100 text-blue-800 px-2 py-1 rounded"
                            >
                                SSL
                            </span>
                            <span
                                x-show="profile.useTLS"
                                class="bg-green-100 text-green-800 px-2 py-1 rounded"
                            >
                                TLS
                            </span>
                        </div>
                    </div>
                    <div class="flex-shrink-0 ml-2">
                        <div
                            class="w-6 h-6 rounded-full border-2 flex items-center justify-center"
                            :class="{
                                'border-marki-primary': selectedProfile && selectedProfile.objectId === profile.objectId,
                                'border-gray-300': !(selectedProfile && selectedProfile.objectId === profile.objectId)
                            }"
                        >
                            <div
                                x-show="selectedProfile && selectedProfile.objectId === profile.objectId"
                                class="w-3 h-3 bg-marki-primary rounded-full"
                            ></div>
                        </div>
                    </div>
                </div>
            </div>
        </template>
    </div>

    <!-- Affichage du profil sélectionné -->
    <div
        x-show="selectedProfile"
        class="mt-4 bg-gray-50 border border-gray-200 rounded-lg p-3"
    >
        <h6 class="text-sm font-semibold text-gray-900 mb-2">Profil sélectionné</h6>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-2 text-sm">
            <div>
                <p class="text-gray-500 text-xs">Nom</p>
                <p class="font-medium" x-text="selectedProfile.name"></p>
            </div>
            <div>
                <p class="text-gray-500 text-xs">Email</p>
                <p class="font-medium" x-text="selectedProfile.email"></p>
            </div>
            <div>
                <p class="text-gray-500 text-xs">Serveur</p>
                <p class="font-medium" x-text="selectedProfile.server + ':' + selectedProfile.port"></p>
            </div>
            <div>
                <p class="text-gray-500 text-xs">Sécurité</p>
                <p class="font-medium">
                    <span x-show="selectedProfile.useSSL">SSL</span>
                    <span x-show="selectedProfile.useSSL && selectedProfile.useTLS">, </span>
                    <span x-show="selectedProfile.useTLS">TLS</span>
                    <span x-show="!selectedProfile.useSSL && !selectedProfile.useTLS">Aucun</span>
                </p>
            </div>
        </div>
    </div>

    <!-- Input caché pour le formulaire (si nécessaire) -->
    <input
        type="hidden"
        x-model="selectedProfile ? selectedProfile.objectId : ''"
        name="smtpProfileId"
    >
    <input
        type="hidden"
        x-model="selectedProfile ? selectedProfile.email : ''"
        name="senderEmail"
    >
</div>
