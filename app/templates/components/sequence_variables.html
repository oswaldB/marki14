<!-- sequence_variables.html - Composant pour l'affichage des variables disponibles -->
<div
    x-data="{
    // Utilisation des stores centralisés
    get variablesStore() {
        try {
            return Alpine.store('variables');
        } catch (error) {
            console.warn('variablesStore not available yet:', error);
            return null;
        }
    },
    
    get paymentLinksStore() {
        try {
            return Alpine.store('paymentLinks');
        } catch (error) {
            console.warn('paymentLinksStore not available yet:', error);
            return null;
        }
    },

    async init() {
        // Charger les données via les stores
        await this.variablesStore.loadVariables();
        await this.paymentLinksStore.loadPaymentLinks();
    },

    get filteredVariables() {
        return this.variablesStore ? this.variablesStore.filteredVariables : [];
    },

    set searchTerm(term) {
        if (this.variablesStore) {
            this.variablesStore.setSearchTerm(term);
        }
    },
    
    get searchTerm() {
        return this.variablesStore ? this.variablesStore.searchTerm : '';
    },

    get isLoading() {
        return (this.variablesStore && this.variablesStore.isLoading) || 
               (this.paymentLinksStore && this.paymentLinksStore.isLoading);
    },
    
    get error() {
        return this.variablesStore.error || this.paymentLinksStore.error;
    },

    get paymentLinks() {
        return this.paymentLinksStore ? this.paymentLinksStore.links : [];
    },

    copyVariable(variable) {
        return this.variablesStore ? this.variablesStore.copyVariable(variable) : false;
    },

    copyPaymentLink(link) {
        return this.paymentLinksStore ? this.paymentLinksStore.copyPaymentLinkVariable(link) : false;
    },

    copyPaymentUrl(link) {
        return this.paymentLinksStore.copyPaymentLinkUrl(link);
    }
}"
    class="sequence-variables-container"
>
    <!-- Header des variables -->
    <div class="bg-white border border-gray-200 rounded-lg p-4 shadow-sm mb-4">
        <h4 class="text-lg font-bold mb-3">
            <span class="text-marki-primary text-sm">
                <i class="fa-regular fa-code"></i>
            </span>
            Variables disponibles
        </h4>

        <!-- Champ de recherche -->
        <div class="mb-4">
            <div class="relative">
                <input
                    type="text"
                    x-model="searchTerm"
                    placeholder="Rechercher une variable..."
                    class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-marki-primary focus:border-transparent pl-8"
                />
                <span
                    class="absolute left-2 top-1/2 transform -translate-y-1/2 text-sm"
                >
                    <i class="fa-regular fa-search"></i>
                </span>
            </div>
        </div>

        <!-- Notification d'erreur -->
        <div
            x-show="error"
            class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded text-sm"
        >
            <button
                @click="error = null"
                class="text-gray-400 hover:text-gray-600 ml-2"
            >
                <i class="fa-regular fa-times"></i>
            </button>
            <span x-text="error"></span>
        </div>
    </div>

    <!-- Liste des variables -->
    <div
        class="bg-white border border-gray-200 rounded-lg p-4 shadow-sm"
        style="max-height: 400px; overflow-y: auto"
    >
        <div x-show="isLoading" class="text-center">
            <i class="fa-regular fa-spinner fa-spin text-marki-primary"></i>
            <p class="text-sm text-gray-500 mt-2">Chargement...</p>
        </div>

        <div
            x-show="!isLoading && filteredVariables.length === 0"
            class="text-center"
        >
            <p class="text-sm text-gray-500">
                <span x-show="searchTerm"
                    >Aucune variable trouvée pour "{{ searchTerm }}"</span
                >
                <span x-show="!searchTerm">Aucune variable disponible</span>
            </p>
        </div>

        <!-- Variables simples -->
        <template x-for="variable in filteredVariables" :key="variable">
            <div
                class="bg-gray-50 border border-gray-200 rounded p-2 mb-2 variable-item"
                style="border-left: 3px solid #3b82f6"
            >
                <div class="flex items-center">
                    <div class="flex-1">
                        <div class="flex">
                            <div>
                                <button
                                    @click="copyVariable(variable)"
                                    class="bg-blue-500 text-white px-2 py-1 rounded text-sm hover:bg-blue-600 border border-blue-500"
                                    :title="`Copier [[${variable}]]`"
                                >
                                    <span class="text-sm">
                                        <i class="fa-regular fa-copy"></i>
                                    </span>
                                </button>
                            </div>
                            <div class="ml-2">
                                <code
                                    class="text-sm"
                                    style="
                                        background: none;
                                        padding: 0.25rem 0.5rem;
                                    "
                                >
                                    [[<span x-text="variable"></span>]]
                                </code>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </template>
    </div>

    <!-- Liens de paiement -->
    <div class="bg-white border border-gray-200 rounded-lg p-4 shadow-sm mt-4">
        <h5 class="text-sm font-semibold mb-2">
            <span class="text-blue-500 text-sm">
                <i class="fa-regular fa-credit-card"></i>
            </span>
            Liens de paiement disponibles
        </h5>
        <div class="text-sm">
            <div class="space-y-2">
                <template x-for="link in paymentLinks" :key="link.id">
                    <div
                        class="flex items-center justify-between p-2 bg-gray-50 rounded"
                    >
                        <div>
                            <div class="font-medium" x-text="link.name"></div>
                            <div
                                class="text-xs text-gray-600 break-all"
                                x-text="link.url"
                            ></div>
                        </div>
                        <div class="flex space-x-2">
                            <button
                                @click="copyPaymentLink(link)"
                                class="text-blue-500 hover:text-blue-700"
                                title="Copier la variable"
                            >
                                <i class="fa-regular fa-copy"></i>
                            </button>
                            <button
                                @click="copyPaymentUrl(link)"
                                class="text-green-500 hover:text-green-700"
                                title="Copier l'URL"
                            >
                                <i class="fa-regular fa-link"></i>
                            </button>
                        </div>
                    </div>
                </template>
                <div
                    x-show="paymentLinks.length === 0"
                    class="text-center py-4 text-gray-500"
                >
                    Aucun lien de paiement disponible
                </div>
            </div>
            <button
                @click="openAddPaymentLinkModal"
                class="mt-3 bg-marki-primary hover:bg-marki-primary-dark text-white px-3 py-1 rounded text-xs flex items-center"
            >
                <i class="fa-regular fa-plus mr-1"></i>
                Ajouter un lien
            </button>
        </div>
    </div>

    <!-- Aide -->
    <div class="bg-white border border-gray-200 rounded-lg p-4 shadow-sm mt-4">
        <h5 class="text-sm font-semibold mb-2">
            <span class="text-blue-500 text-sm">
                <i class="fa-regular fa-question-circle"></i>
            </span>
            Comment utiliser ?
        </h5>
        {% include 'components/chatgpt_prompt.html' %}
    </div>
</div>
