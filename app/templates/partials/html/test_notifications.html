{% extends "base/html/base.html" %}

{% block content %}
<h1 class="text-2xl font-bold mb-6">Test des Notifications</h1>

<div class="space-y-4">
    <button
        onclick="$store.notifications.addNotification('Notification de succès!', 'success')"
        class="px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600"
    >
        Notification Succès
    </button>

    <button
        onclick="$store.notifications.addNotification('Notification d\'information', 'info')"
        class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600"
    >
        Notification Info
    </button>

    <button
        onclick="$store.notifications.addNotification('Attention!', 'warning')"
        class="px-4 py-2 bg-yellow-500 text-black rounded hover:bg-yellow-600"
    >
        Notification Avertissement
    </button>

    <button
        onclick="$store.notifications.addNotification('Erreur critique!', 'error')"
        class="px-4 py-2 bg-red-500 text-white rounded hover:bg-red-600"
    >
        Notification Erreur
    </button>

    <button
        onclick="$store.notifications.addNotification('Notification longue durée', 'info', 10000)"
        class="px-4 py-2 bg-purple-500 text-white rounded hover:bg-purple-600"
    >
        Notification 10 secondes
    </button>

    <button
        onclick="$store.notifications.addNotification('Notification permanente (cliquez pour fermer)', 'warning', 0)"
        class="px-4 py-2 bg-gray-500 text-white rounded hover:bg-gray-600"
    >
        Notification Permanente
    </button>
</div>

<h2 class="text-xl font-semibold mt-8 mb-4">Exemple avec JavaScript</h2>

<button
    onclick="exempleAvecJavaScript()"
    class="px-4 py-2 bg-indigo-500 text-white rounded hover:bg-indigo-600"
>
    Exécuter exemple JavaScript
</button>

<script>
    function exempleAvecJavaScript() {
        // Simulation d'une opération asynchrone
        const loadingId = Date.now();
        $store.notifications.addNotification('Chargement en cours...', 'info', 0);

        // Simulation d'un appel API
        setTimeout(() => {
            $store.notifications.removeNotification(loadingId);
            $store.notifications.addNotification('Opération terminée avec succès!', 'success');
        }, 2000);
    }

    // Exemple avec événement personnalisé
    function envoyerNotificationParEvenement() {
        const event = new CustomEvent('add-notification', {
            detail: {
                message: 'Notification via événement personnalisé',
                type: 'success',
                duration: 3000
            }
        });
        document.dispatchEvent(event);
    }
</script>

<h2 class="text-xl font-semibold mt-8 mb-4">Exemple avec événement</h2>

<button
    onclick="envoyerNotificationParEvenement()"
    class="px-4 py-2 bg-teal-500 text-white rounded hover:bg-teal-600"
>
    Notification par Événement
</button>
{% endblock %}

<!-- Inclure le système de notifications -->
{% include 'partials/html/_notifications.html' %}
