<!-- app/templates/partials/_notifications.html -->
<div
    id="notifications-container"
    x-data="{ notifications: $store.notifications.notifications }"
    class="fixed top-4 left-0 right-0 z-50 pointer-events-none px-4"
>
    <template x-for="notification in notifications">
        <div
            x-show="notification.show"
            x-transition:enter="transition-all ease-out duration-300"
            x-transition:enter-start="opacity-0 transform translate-y-4"
            x-transition:enter-end="opacity-100 transform translate-y-0"
            x-transition:leave="transition-all ease-in duration-200"
            x-transition:leave-start="opacity-100 transform translate-y-0"
            x-transition:leave-end="opacity-0 transform-translate-y-2"
            class="w-screen max-w-full mx-auto mb-3 pointer-events-auto"
        >
            <!-- Notification Success -->
            <div
                x-show="notification.type === 'success'"
                class="flex items-center justify-between w-full p-4 rounded-lg shadow-lg border bg-green-50 border-green-200"
            >
                <!-- Indicateur de couleur -->
                <div
                    class="w-1 h-full rounded-l-md mr-3 hidden md:block bg-green-500"
                ></div>

                <!-- Contenu -->
                <div class="flex-1 flex items-center min-w-0">
                    <!-- Icône -->
                    <div class="mr-3 flex-shrink-0">
                        <i
                            class="fa-regular fa-check-circle text-green-600 text-base"
                        ></i>
                    </div>

                    <!-- Message -->
                    <div class="flex-1 min-w-0">
                        <p
                            class="text-sm font-medium text-green-800 truncate"
                            x-text="notification.message"
                        ></p>
                    </div>
                </div>

                <!-- Bouton de fermeture -->
                <button
                    @click="$store.notifications.removeNotification(notification.id)"
                    class="ml-4 text-gray-500 hover:text-gray-700 focus:outline-none flex-shrink-0"
                    aria-label="Fermer"
                >
                    <i class="fa-regular fa-circle-exclamation text-red-600 text-base"></i>
                </button>
            </div>

            <!-- Notification Info -->
            <div
                x-show="notification.type === 'info'"
                class="flex items-center justify-between w-full p-4 rounded-lg shadow-lg border bg-blue-50 border-blue-200"
            >
                <!-- Indicateur de couleur -->
                <div
                    class="w-1 h-full rounded-l-md mr-3 hidden md:block bg-blue-500"
                ></div>

                <!-- Contenu -->
                <div class="flex-1 flex items-center min-w-0">
                    <!-- Icône -->
                    <div class="mr-3 flex-shrink-0">
                        <i
                            class="fa-regular fa-question-circle text-blue-600 text-base"
                        ></i>
                    </div>

                    <!-- Message -->
                    <div class="flex-1 min-w-0">
                        <p
                            class="text-sm font-medium text-blue-800 truncate"
                            x-text="notification.message"
                        ></p>
                    </div>
                </div>

                <!-- Bouton de fermeture -->
                <button
                    @click="$store.notifications.removeNotification(notification.id)"
                    class="ml-4 text-gray-400 hover:text-gray-600 focus:outline-none flex-shrink-0"
                    aria-label="Fermer"
                >
                    <i class="fa-regular fa-times-circle text-red-600 text-base"></i>
                </button>
            </div>

            <!-- Notification Warning -->
            <div
                x-show="notification.type === 'warning'"
                class="flex items-center justify-between w-full p-4 rounded-lg shadow-lg border bg-yellow-50 border-yellow-200"
            >
                <!-- Indicateur de couleur -->
                <div
                    class="w-1 h-full rounded-l-md mr-3 hidden md:block bg-yellow-500"
                ></div>

                <!-- Contenu -->
                <div class="flex-1 flex items-center min-w-0">
                    <!-- Icône -->
                    <div class="mr-3 flex-shrink-0">
                        <i class="fa-regular fa-meh text-yellow-600 text-base"></i>
                    </div>

                    <!-- Message -->
                    <div class="flex-1 min-w-0">
                        <p
                            class="text-sm font-medium text-yellow-800 truncate"
                            x-text="notification.message"
                        ></p>
                    </div>
                </div>

                <!-- Bouton de fermeture -->
                <button
                    @click="$store.notifications.removeNotification(notification.id)"
                    class="ml-4 text-gray-400 hover:text-gray-600 focus:outline-none flex-shrink-0"
                    aria-label="Fermer"
                >
                    <i class="fa-regular fa-circle-exclamation text-base"></i>
                </button>
            </div>

            <!-- Notification Error -->
            <div
                x-show="notification.type === 'error'"
                class="flex items-center justify-between w-full p-4 rounded-lg shadow-lg border bg-red-50 border-red-200"
            >
                <!-- Indicateur de couleur -->
                <div
                    class="w-1 h-full rounded-l-md mr-3 hidden md:block bg-red-500"
                ></div>

                <!-- Contenu -->
                <div class="flex-1 flex items-center min-w-0">
                    <!-- Icône -->
                    <div class="mr-3 flex-shrink-0">
                        <i
                            class="fa-regular fa-circle-exclamation text-red-600 text-base"
                        ></i>
                    </div>

                    <!-- Message -->
                    <div class="flex-1 min-w-0">
                        <p
                            class="text-sm font-medium text-red-800 truncate"
                            x-text="notification.message"
                        ></p>
                    </div>
                </div>

                <!-- Bouton de fermeture -->
                <button
                    @click="$store.notifications.removeNotification(notification.id)"
                    class="ml-4 text-gray-400 hover:text-gray-600 focus:outline-none flex-shrink-0"
                    aria-label="Fermer"
                >
                    <i class="fa-regular fa-times-circle text-red-600 text-base"></i>
                </button>
            </div>
        </div>
    </template>
</div>

<script>
    document.addEventListener("alpine:init", () => {
        Alpine.store("notifications", {
            notifications: [],
            counter: 0,

            init() {
                // Écouter les événements personnalisés pour ajouter des notifications
                document.addEventListener("add-notification", (e) => {
                    this.addNotification(
                        e.detail.message,
                        e.detail.type,
                        e.detail.duration,
                    );
                });
            },

            addNotification(message, type = "info", duration) {
                const id = this.counter++;
                const notification = {
                    id,
                    message,
                    type,
                    show: true,
                };
                this.notifications.push(notification);

                // Masquer automatiquement après la durée spécifiée
                if (duration && duration > 0) {
                    setTimeout(() => {
                        this.removeNotification(id);
                    }, duration);
                }
            },

            removeNotification(id) {
                const index = this.notifications.findIndex((n) => n.id === id);
                if (index !== -1) {
                    this.notifications[index].show = false;
                    setTimeout(() => {
                        this.notifications.splice(index, 1);
                    }, 200);
                }
            },
        });
    });
</script>
