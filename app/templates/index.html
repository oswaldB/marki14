{% extends "base.html" %} {% block title %}Bienvenue sur Marki{% endblock %} {%

>

        <div>
            <img
                src="{{ url_for('static', filename='marki-logo.png') }}"
                alt="Marki Logo"
                class="mx-auto h-32 w-auto mb-8"
