{% extends "base.html" %} {% block title %}Bienvenue sur Marki{% endblock %} {%
block content %}
<main
    class="container mx-auto px-4 min-h-screen"
    style="
        min-height: 80vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
    "
>

    <section
        class="min-h-screen flex items-center justify-center"
        x-data="indexState()"
        x-init="initialize(); console.log('State initialized:', $data)"
    >
        <div class="text-center">
            <div class="text-center">
                <img
                    src="{{ url_for('static', filename='marki-logo.png') }}"
                    alt="Marki Logo"
                    style="
                        height: 8rem;
                        width: auto;
                        margin: 0 auto 2rem;
                        display: block;
                    "
                />
                <h1 class="text-4xl font-bold" x-text="pageTitle">
                    Bienvenue sur Marki
                </h1>
                <p class="text-xl text-gray-600" x-text="pageDescription">
                    Plateforme de diagnostic et de gestion
                </p>

                <div
                    class="flex justify-center space-x-4"
                    style="margin-top: 2rem"
                >
                    <a
                        href="/login"
                        class="bg-marki-primary text-white px-6 py-3 rounded text-lg hover:bg-marki-primary-dark"
                        >Se connecter</a
                    >
                    <a
                        href="/styleguide"
                        class="bg-white border border-gray-300 text-gray-700 px-6 py-3 rounded text-lg hover:bg-gray-50"
                        >Voir le Styleguide</a
                    >
                </div>
            </div>
        </div>
    </section>

    <!-- Section des fonctionnalités -->
    <section class="py-12">
        <div class="container mx-auto px-4">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <template x-for="feature in features" :key="feature.title">
                    <div>
                        <div
                            class="bg-white border border-gray-200 rounded-lg p-6 shadow-sm text-center"
                        >
                            <div
                                style="
                                    font-size: 2.5rem;
                                    margin-bottom: 1rem;
                                    color: var(--primary);
                                "
                            >
                                <i :class="feature.icon" aria-hidden="true"></i>
                            </div>
                            <h3
                                class="text-xl font-bold"
                                x-text="feature.title"
                            ></h3>
                            <p
                                class="text-sm text-gray-600"
                                x-text="feature.description"
                            ></p>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </section>


            <!-- Hello World mis à jour -->
            <hello-world></hello-world>
        </div>
    </section>
</main>

<footer class="bg-gray-100 border-t border-gray-200 py-6">
    <div class="text-center text-sm text-gray-600">
        <p><small>© 2026 Marki. Tous droits réservés.</small></p>
    </div>
</footer>
{% endblock %} {% block scripts %}
<script src="/static/js/indexState.js"></script>
{% endblock %}
