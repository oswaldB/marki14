<!doctype html>
<html lang="fr" x-data="baseAppState()">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{% block title %}Marki - Application{% endblock %}</title>

        <!-- Bulma CSS -->
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css"
        />
        <!-- Marki Primary Color CSS -->
        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='css/bulma-primary.css') }}"
        />
        <!-- Pas de CSS personnalisé supplémentaire - uniquement Bulma + couleurs primaires -->

        <!-- Font Awesome local -->
        <link
            href="{{ url_for('static', filename='assets/fontawesome/css/fontawesome.css') }}"
            rel="stylesheet"
        />
        <link
            href="{{ url_for('static', filename='assets/fontawesome/css/regular.css') }}"
            rel="stylesheet"
        />
        <!-- Axios CDN -->
        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

        <!-- parseAxios configuration - must be loaded before Alpine -->
        <script src="{{ url_for('static', filename='js/parseAxios.js') }}"></script>

        <!-- Base app state - doit être chargé avant Alpine -->
        <script src="{{ url_for('static', filename='js/alpines/baseAppState.js') }}"></script>

        <!-- Alpine.js CDN -->
        <script
            defer
            src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
        ></script>

        {% block head %}{% endblock %}
    </head>
    <body>
        <!-- Layout principal avec Bulma -->
        <div class="columns is-gapless">
            <!-- Sidebar - visible sur desktop -->
            <div
                class="is-narrow is-hidden-mobile"
                style="
                    width: 200px;
                    min-height: 100vh;
                    background-color: white;
                    border-right: 1px solid #dbdbdb;
                "
            >
                <div class="p-4">
                    <!-- Logo -->
                    <div class="mb-5">
                        <img
                            src="/static/marki-logo.png"
                            alt="Marki Logo"
                            style="height: 3rem"
                        />
                    </div>

                    <!-- Menu de navigation -->
                    <aside class="menu">
                        <ul class="menu-list">
                            <template x-for="item in navItems" :key="item.path">
                                <li>
                                    <a
                                        :href="item.path"
                                        @click.prevent="navigateTo(item.path)"
                                        class="is-flex is-align-items-center"
                                        :class="{ 'is-active': item.active }"
                                    >
                                        <span class="icon is-small mr-3">
                                            <i :class="item.icon"></i>
                                        </span>
                                        <span x-text="item.label"></span>
                                    </a>
                                </li>
                            </template>
                        </ul>
                    </aside>

                    <!-- Section utilisateur -->
                    <div class="mt-auto pt-4">
                        <div class="box">
                            <div class="media">
                                <div class="media-left">
                                    <span class="icon is-medium">
                                        <i
                                            class="fa-regular fa-user fa-2x has-text-primary"
                                        ></i>
                                    </span>
                                </div>
                                <div class="media-content">
                                    <p
                                        class="is-size-6 has-text-weight-semibold"
                                    >
                                        Utilisateur
                                    </p>
                                    <p class="is-size-7 has-text-grey">
                                        Marki App
                                    </p>
                                </div>
                            </div>
                        </div>
                        <button
                            @click="logout()"
                            class="button is-fullwidth is-light"
                        >
                            <span class="icon is-small mr-2">
                                <i class="fa-regular fa-sign-out"></i>
                            </span>
                            <span>Déconnexion</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Contenu principal -->
            <div class="column">
                <!-- Contenu de la page -->
                <main class="p-4">{% block content %}{% endblock %}</main>
            </div>
        </div>

        {% block scripts %} {% endblock %}
        <!-- Système de notifications -->
        {% include '_notifications.html' %}
    </body>
</html>
