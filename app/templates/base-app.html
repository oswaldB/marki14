<!doctype html>
<html lang="fr" x-data="baseAppState()">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{% block title %}Marki - Application{% endblock %}</title>

        <!-- Tailwind CSS via CDN -->
        <script src="https://cdn.tailwindcss.com"></script>
        <script src="{{ url_for('static', filename='js/tailwind-config.js') }}"></script>
        <style>
            /* Custom styles for Marki brand */
            .bg-marki-primary {
                background-color: #007ace;
            }
            .text-marki-primary {
                color: #007ace;
            }
            .border-marki-primary {
                border-color: #007ace;
            }
            .hover\:bg-marki-primary-dark:hover {
                background-color: #005bb5;
            }
            .focus\:ring-marki-primary:focus {
                box-shadow: 0 0 0 3px rgba(0, 122, 206, 0.5);
                border-color: #007ace;
            }
        </style>

        <!-- Font Awesome local -->
        <link
            href="{{ url_for('static', filename='assets/fontawesome/css/fontawesome.css') }}"
            rel="stylesheet"
        />
        <link
            href="{{ url_for('static', filename='assets/fontawesome/css/regular.css') }}"
            rel="stylesheet"
        />
        <!-- Axios CDN -->
        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

        <!-- parseAxios configuration - must be loaded before Alpine -->
        <script src="{{ url_for('static', filename='js/parseAxios.js') }}"></script>

        <!-- Base app state - doit être chargé avant Alpine -->
        <script src="{{ url_for('static', filename='js/alpines/baseAppState.js') }}"></script>

        <!-- Store Alpine.js consolidé - remplace tous les anciens stores -->
        <script src="{{ url_for('static', filename='js/stores/index.js') }}"></script>

        <!-- Alpine.js CDN -->
        <script
            defer
            src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
        ></script>

        <!-- LitElement CDN for web components -->
        <script
            type="module"
            src="https://cdn.jsdelivr.net/npm/lit@2.8.0/+esm"
        ></script>
        <!-- Symbiote.js CDN for web components -->
        <script
            type="module"
            src="https://symbiotejs.github.io/symbiote.js/core/Symbiote.js"
        ></script>

        <!-- ToastUI Editor CDN -->
        <link
            rel="stylesheet"
            href="https://uicdn.toast.com/editor/latest/toastui-editor.css"
        />

        {% block head %}{% endblock %}
    </head>
    <body>
        <!-- Layout principal avec Tailwind -->
        <div class="flex flex-nowrap min-h-screen">
            <!-- Sidebar - visible sur desktop -->
            <div
                class="hidden md:block w-[200px] min-h-screen bg-white border-r border-gray-200"
            >
                <div class="p-4">
                    <!-- Logo -->
                    <div class="mb-5">
                        <img
                            src="/static/marki-logo.png"
                            alt="Marki Logo"
                            class="h-12"
                        />
                    </div>

                    <!-- Menu de navigation -->
                    <nav class="space-y-2">
                        <template x-for="item in navItems" :key="item.path">
                            <a
                                :href="item.path"
                                @click.prevent="navigateTo(item.path)"
                                class="flex items-center p-2 rounded hover:bg-gray-100"
                                :class="{ 'bg-marki-primary text-white': item.active, 'text-gray-700': !item.active }"
                            >
                                <span class="mr-3">
                                    <i :class="item.icon"></i>
                                </span>
                                <span x-text="item.label"></span>
                            </a>
                        </template>
                    </nav>

                    <!-- Section utilisateur -->
                    <div class="mt-auto pt-4">
                        <div
                            class="bg-white border border-gray-200 rounded-lg p-3 shadow-sm"
                        >
                            <div class="flex items-center">
                                <div class="mr-3">
                                    <span class="text-2xl text-marki-primary">
                                        <i class="fa-regular fa-user"></i>
                                    </span>
                                </div>
                                <div>
                                    <p
                                        class="text-sm font-semibold text-gray-900"
                                    >
                                        Utilisateur
                                    </p>
                                    <p class="text-xs text-gray-500">
                                        Marki App
                                    </p>
                                </div>
                            </div>
                        </div>
                        <button
                            @click="logout()"
                            class="w-full mt-3 bg-marki-primary text-white py-2 px-4 rounded hover:bg-marki-primary-dark focus:outline-none focus:ring-2 focus:ring-marki-primary focus:ring-offset-2"
                        >
                            <span class="mr-2">
                                <i class="fa-regular fa-sign-out"></i>
                            </span>
                            <span>Déconnexion</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Contenu principal -->
            <div class="flex-1">
                <!-- Contenu de la page -->
                <main class="p-4">{% block content %}{% endblock %}</main>
            </div>
        </div>

        {% block scripts %} {% endblock %}

        <!-- ToastUI Editor JS CDN - loaded after Alpine for proper initialization -->
        <script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>

        <!-- Système de notifications -->
        {% include '_notifications.html' %}
    </body>
</html>
