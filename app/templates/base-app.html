<!doctype html>
<html lang="fr" x-data="baseAppState()">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{% block title %}Mon Application{% endblock %}</title>

        <!-- Tailwind CSS CDN -->
        <script src="https://cdn.tailwindcss.com"></script>

        <!-- LineIcons CDN -->
        <link
            href="https://cdn.lineicons.com/5.1/line/lineicons.css"
            rel="stylesheet"
        />

        <!-- Axios CDN -->
        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

        <!-- parseAxios configuration -->
        <script src="{{ url_for('static', filename='js/parseAxios.js') }}"></script>

        <!-- Base app state - doit être chargé avant Alpine -->
        <script src="{{ url_for('static', filename='js/templates/base-app/baseAppState.js') }}"></script>

        <!-- Alpine.js CDN -->
        <script
            defer
            src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
        ></script>

        {% block head %}{% endblock %}
    </head>
    <body class="bg-gray-100">
        <!-- Bouton pour ouvrir la sidebar sur mobile -->
        <button
            @click="toggleSidebar"
            type="button"
            class="inline-flex items-center p-2 mt-3 ms-3 text-sm text-gray-500 rounded-lg sm:hidden hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200 dark:text-gray-400 dark:hover:bg-gray-700 dark:focus:ring-gray-600"
        >
            <span class="sr-only">Open sidebar</span>
            <i class="lni lni-menu text-sky-900"></i>
        </button>

        <!-- Sidebar -->
        <aside
            id="logo-sidebar"
            x-show="sidebarOpen"
            x-transition:enter="transition ease-in-out duration-300"
            x-transition:enter-start="-translate-x-full"
            x-transition:enter-end="translate-x-0"
            x-transition:leave="transition ease-in-out duration-300"
            x-transition:leave-start="translate-x-0"
            x-transition:leave-end="-translate-x-full"
            class="fixed top-0 left-0 z-40 w-64 h-screen transition-transform sm:translate-x-0"
            aria-label="Sidebar"
        >
            <div
                class="h-full px-3 py-4 overflow-y-auto bg-gray-50 dark:bg-gray-800"
            >
                <a href="/" class="flex items-center ps-2.5 mb-5">
                    <img
                        src="/static/marki-logo.png"
                        class="h-6 me-3"
                        alt="Marki Logo"
                    />
                    <span
                        class="self-center text-lg font-semibold whitespace-nowrap dark:text-white"
                        >Marki</span
                    >
                </a>
                <ul class="space-y-2 font-medium">
                    <li>
                        <a
                            href="/"
                            class="flex items-center p-2 text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-gray-700 group"
                        >
                            <i class="lni lni-home text-sky-900"></i>
                            <span class="ms-3">Dashboard</span>
                        </a>
                    </li>
                    <li>
                        <a
                            href="#"
                            class="flex items-center p-2 text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-gray-700 group"
                        >
                            <i class="lni lni-layout text-sky-900"></i>
                            <span class="ms-3">Kanban</span>
                        </a>
                    </li>
                    <li>
                        <a
                            href="#"
                            class="flex items-center p-2 text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-gray-700 group"
                        >
                            <i class="lni lni-inbox text-sky-900"></i>
                            <span class="ms-3">Inbox</span>
                            <span
                                class="inline-flex items-center justify-center w-3 h-3 p-3 ms-3 text-sm font-medium text-blue-800 bg-blue-100 rounded-full dark:bg-blue-900 dark:text-blue-300"
                                >2</span
                            >
                        </a>
                    </li>
                    <li>
                        <a
                            href="#"
                            class="flex items-center p-2 text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-gray-700 group"
                        >
                            <i class="lni lni-user text-sky-900"></i>
                            <span class="ms-3">Users</span>
                        </a>
                    </li>
                    <li>
                        <a
                            href="#"
                            class="flex items-center p-2 text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-gray-700 group"
                        >
                            <i class="lni lni-package text-sky-900"></i>
                            <span class="ms-3">Products</span>
                        </a>
                    </li>
                    <li>
                        <a
                            href="#"
                            @click.prevent="logout()"
                            class="flex items-center p-2 text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-gray-700 group"
                        >
                            <i class="lni lni-exit text-sky-900"></i>
                            <span class="ms-3">Déconnexion</span>
                        </a>
                    </li>
                </ul>
            </div>
        </aside>

        <!-- Contenu principal -->
        <div class="p-4 sm:ml-64">
            <div
                class="p-4 border border-gray-200 border-dashed rounded-lg dark:border-gray-700 min-h-screen"
            >
                {% block content %}{% endblock %}
            </div>
        </div>

        {% block scripts %}
        <script src="{{ url_for('static', filename='js/templates/base-app/baseAppState.js') }}"></script>
        {% endblock %}
        <!-- Système de notifications -->
        {% include 'partials/_notifications.html' %}
    </body>
</html>
