{% extends "base.html" %} {% block title %}Connexion - Marki{% endblock %} {%
block content %}
<main class="container mx-auto px-4">
    <section class="py-12">
        <div class="flex justify-center">
            <div class="w-full max-w-md">
                <div
                    class="bg-white border border-gray-200 rounded-lg p-6 shadow-sm text-center"
                >
                    <img
                        src="/static/marki-logo.png"
                        alt="Marki Logo"
                        style="height: 5rem; width: auto; margin: 0 auto 1rem"
                    />
                    <h2 class="text-xl font-bold">
                        Connectez-vous à votre compte
                    </h2>
                </div>
                <form
                    x-data="loginState()"
                    @submit.prevent="login()"
                    class="bg-white border border-gray-200 rounded-lg p-6 shadow-sm mt-6"
                >
                    <div class="mb-4">
                        <label
                            class="block text-sm font-medium text-gray-700 mb-1"
                            >Identifiant</label
                        >
                        <div>
                            <input
                                id="username"
                                name="username"
                                type="text"
                                required
                                x-model="username"
                                autocomplete="username"
                                placeholder="Votre identifiant"
                                class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-marki-primary focus:border-transparent"
                            />
                        </div>
                    </div>
                    <div class="mb-4">
                        <label
                            class="block text-sm font-medium text-gray-700 mb-1"
                            >Mot de passe</label
                        >
                        <div>
                            <input
                                id="password"
                                name="password"
                                type="password"
                                required
                                x-model="password"
                                autocomplete="current-password"
                                placeholder="Votre mot de passe"
                                class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-marki-primary focus:border-transparent"
                            />
                        </div>
                    </div>

                    <div class="mb-4">
                        <div class="flex items-center">
                            <input
                                id="remember-me"
                                name="remember-me"
                                type="checkbox"
                                x-model="rememberMe"
                                class="mr-2"
                            />
                            <label
                                for="remember-me"
                                class="text-sm text-gray-700"
                                >Se souvenir de moi</label
                            >
                        </div>
                    </div>

                    <div class="mb-4">
                        <div>
                            <button
                                type="submit"
                                class="w-full bg-marki-primary text-white py-2 px-4 rounded hover:bg-marki-primary-dark"
                            >
                                Connexion
                            </button>
                        </div>
                    </div>

                    <div
                        x-show="errorMessage"
                        x-text="errorMessage"
                        class="text-red-500 text-center text-sm"
                        style="margin-top: 1rem"
                    ></div>
                    {% if error %}
                    <div
                        class="text-red-500 text-center text-sm"
                        style="margin-top: 1rem"
                    >
                        {{ error }}
                    </div>
                    {% endif %}
                </form>
            </div>
        </div>
    </section>
</main>
{% endblock %} {% block scripts %}
<script src="{{ url_for('static', filename='js/alpines/loginState.js') }}"></script>
{% endblock %}
