<!DOCTYPE html>
<html lang="fr" x-data="appState()">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Éditeur d'email - Sequence Alpine</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Alpine.js with store plugin -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@alpinejs/persist@3.x.x/dist/cdn.min.js" defer></script>
    
    <!-- Alpine.js Collapse plugin for collapsible sections -->
    <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
    
    <!-- Lit for web components -->
    <script type="module" src="https://cdn.jsdelivr.net/npm/lit@2.8.0/+esm"></script>
    
    <!-- Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    
    <!-- parseAxios configuration -->
    <script src="{{ url_for('static', filename='js/parseAxios.js') }}"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- ToastUI Editor CSS -->
    <link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.css" />
    <!-- ToastUI Editor JS -->
    <script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.js"></script>
    <!-- ToastUI Editor Lit Component -->
    <script type="module" src="{{ url_for('static', filename='js/components/toastui-editor-lit.js') }}"></script>
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f8fafc;
        }
        
        /* PineUI-inspired Header */
        header {
            background-color: white;
            border-bottom: 1px solid #e2e8f0;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }
        
        /* Input fields - PineUI style */
        input[type="text"],
        input[type="number"] {
            border: 1px solid #e2e8f0;
            border-radius: 0.375rem;
            padding: 0.5rem 0.75rem;
            font-size: 0.875rem;
            transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
            width: 100%;
        }
        
        input[type="text"]:focus,
        input[type="number"]:focus {
            border-color: #007ACE;
            outline: none;
            box-shadow: 0 0 0 3px rgba(0, 122, 206, 0.1);
            ring: 2px solid #007ACE;
        }
        
        /* Buttons - PineUI style */
        button {
            border-radius: 0.375rem;
            font-weight: 500;
            transition: all 0.15s ease-in-out;
            font-size: 0.875rem;
            padding: 0.5rem 1rem;
        }
        
        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        
        /* Primary button - Marki brand color */
        .bg-marki-primary {
            background-color: #007ACE;
        }
        
        .bg-marki-primary:hover {
            background-color: #005bb5;
        }
        
        /* Action cards - PineUI style */
        .action-card {
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            background-color: white;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
            transition: all 0.15s ease-in-out;
        }
        
        .action-card:hover {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        
        .action-header {
            background-color: #f1f5f9;
            border-radius: 0.5rem 0.5rem 0 0;
            transition: background-color 0.15s ease-in-out;
        }
        
        .action-header:hover {
            background-color: #e2e8f0;
        }
        
        /* ToastUI Editor styling */
        .toastui-editor {
            border: 1px solid #e2e8f0;
            border-radius: 0.375rem;
        }
        
        /* Variables panel */
        .variables-panel {
            background-color: white;
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
        }
        
        /* Badge for action numbers - Marki brand color */
        .action-badge {
            background-color: #e0f2fe;
            color: #007ACE;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.25rem 0.5rem;
            border-radius: 9999px;
            display: inline-block;
        }
        
        /* Save status indicators */
        .save-status {
            font-size: 0.75rem;
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            font-weight: 500;
        }
        
        .saving {
            color: #f59e0b;
            background-color: #fef3c7;
        }
        
        .saved {
            color: #10b981;
            background-color: #d1fae5;
        }
        
        /* Hover effects for interactive elements */
        .hover\:bg-gray-50:hover {
            background-color: #f9fafb;
        }
        
        /* Focus ring for accessibility */
        .focus\:ring-2:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
            border-color: #3b82f6;
        }
        
        /* Transition for smooth animations */
        .transition-all {
            transition: all 0.15s ease-in-out;
        }
        
        /* Responsive grid improvements */
        @media (min-width: 768px) {
            .md\:grid-cols-3 {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }
    </style>
    
    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.store('sequence', {
                objectId: null,
                nom: '',
                description: '',
                isAuto: false,
                isActif: true,
                actions: [],
                smtpProfiles: { profiles: [], selectedProfile: null },
                createdAt: null,
                
                async loadFromUrl() {
                    try {
                        const pathParts = window.location.pathname.split('/');
                        const sequenceId = pathParts[pathParts.length - 2];
                        
                        if (sequenceId) {
                            const parseAxios = window.parseAxios;
                            if (parseAxios) {
                                const response = await parseAxios.get(`/classes/Sequences/${sequenceId}`);
                                
                                this.objectId = response.data.objectId || null;
                                this.nom = response.data.nom || '';
                                this.description = response.data.description || '';
                                this.isAuto = response.data.isAuto || false;
                                this.isActif = response.data.isActif || true;
                                this.actions = response.data.actions || [];
                                this.createdAt = response.data.createdAt || null;
                                
                                console.log('Séquence chargée:', this);
                                return this;
                            }
                        }
                        return null;
                    } catch (error) {
                        console.error('Erreur lors du chargement de la séquence:', error);
                        return null;
                    }
                },
                
                async loadSmtpProfiles() {
                    try {
                        const parseAxios = window.parseAxios;
                        if (parseAxios) {
                            const response = await parseAxios.get('/classes/SMTPProfile');
                            this.smtpProfiles.profiles = response.data.results || [];
                            console.log('SMTP Profiles loaded:', this.smtpProfiles.profiles);
                        }
                    } catch (error) {
                        console.error('Erreur lors du chargement des profils SMTP:', error);
                        this.smtpProfiles.profiles = [];
                    }
                },
                
                async save() {
                    if (!this.objectId) return;
                    
                    try {
                        const parseAxios = window.parseAxios;
                        await parseAxios.put(`/classes/Sequences/${this.objectId}`, {
                            nom: this.nom,
                            description: this.description,
                            actions: this.actions
                        });
                        return true;
                    } catch (error) {
                        console.error('Erreur lors de la sauvegarde:', error);
                        return false;
                    }
                }
            });
            
            Alpine.data('appState', () => ({
                isSaving: false,
                lastSaved: null,
                currentActionIndex: 0,
                editMode: true,
                
                init() {
                    this.loadSequence();
                    this.checkEditModeFromUrl();
                },
                
                checkEditModeFromUrl() {
                    const pathParts = window.location.pathname.split('/');
                    this.editMode = pathParts.includes('edit');
                },
                
                async loadSequence() {
                    await Alpine.store('sequence').loadFromUrl();
                    this.lastSaved = new Date().toLocaleTimeString();
                },
                
                async saveSequence() {
                    if (!Alpine.store('sequence').objectId) return;
                    
                    this.isSaving = true;
                    try {
                        const success = await Alpine.store('sequence').save();
                        if (success) {
                            this.lastSaved = new Date().toLocaleTimeString();
                        }
                    } finally {
                        this.isSaving = false;
                    }
                },
                
                get currentAction() {
                    const actions = Alpine.store('sequence').actions;
                    return actions[this.currentActionIndex] || null;
                },
                
                addAction(type = 'email') {
                    const newAction = {
                        id: Date.now().toString(),
                        type: type,
                        delay: 0,
                        subject: '',
                        body: '',
                        cc: ''
                    };
                    
                    const actions = [...Alpine.store('sequence').actions, newAction];
                    Alpine.store('sequence').actions = actions.sort((a, b) => a.delay - b.delay);
                },
                
                removeAction(index) {
                    const actions = Alpine.store('sequence').actions.filter((_, i) => i !== index);
                    Alpine.store('sequence').actions = actions;
                },
                
                updateAction(index, field, value) {
                    const actions = [...Alpine.store('sequence').actions];
                    actions[index] = { ...actions[index], [field]: value };
                    Alpine.store('sequence').actions = actions;
                },
                
                updateCurrentActionField(field, value) {
                    if (this.currentAction) {
                        const index = Alpine.store('sequence').actions.findIndex(
                            a => a.id === this.currentAction.id
                        );
                        if (index !== -1) {
                            this.updateAction(index, field, value);
                        }
                    }
                },
                
                publishSequence() {
                    alert('Fonctionnalité de publication à implémenter');
                },
                
                toggleEditMode() {
                    const pathParts = window.location.pathname.split('/');
                    const sequenceId = pathParts[pathParts.length - 2];
                    if (this.editMode) {
                        window.location.href = `/sequence/${sequenceId}`;
                    } else {
                        window.location.href = `/sequence/${sequenceId}/edit`;
                    }
                }
            }));
        });
    </script>
</head>
<body class="bg-gray-50">
    <!-- Header Alpine.js -->
    <header class="bg-white border-b border-gray-200 h-[60px] flex items-center justify-between px-6 sticky top-0 z-10">
        <!-- Bouton de retour -->
        <div class="flex items-center">
            <a href="/sequences" class="text-gray-500 hover:text-gray-700 mr-4">
                <i class="fas fa-times text-xl"></i>
            </a>
            
            <!-- Logo -->
            <div class="flex items-center mr-6">
                <img src="/static/marki-logo.png" alt="Marki Logo" class="h-8 mr-3">
                <div>
                    <h1 class="text-lg font-semibold text-gray-900">Édition de scénario</h1>
                </div>
            </div>
            
            <!-- Nom et description éditables sur la même ligne -->
            <div class="flex-1 flex items-center space-x-4">
                <input
                    x-model="$store.sequence.nom"
                    @blur="saveSequence()"
                    placeholder="Nom du scénario..."
                    class="text-xl font-semibold border-none focus:outline-none focus:ring-0 bg-transparent"
                />
                <span class="text-gray-400">|</span>
                <input
                    x-model="$store.sequence.description"
                    @blur="saveSequence()"
                    placeholder="Description du scénario..."
                    class="text-sm text-gray-600 border-none focus:outline-none focus:ring-0 bg-transparent"
                />
            </div>
        </div>
        
        <!-- Statut et bouton Publier -->
        <div class="flex items-center space-x-4">
            <div class="text-sm">
                <span x-show="lastSaved" x-text="'Enregistré à ' + lastSaved" class="save-status saved"></span>
                <span x-show="isSaving" class="save-status saving">Enregistrement en cours...</span>
            </div>
            <button
                @click="publishSequence()"
                class="bg-marki-primary text-white px-4 py-2 rounded transition-all"
            >
                Publier
            </button>
            <!-- Toggle pour basculer entre les modes -->
            <div class="flex items-center space-x-2">
                <span class="text-sm text-gray-600">Mode Liste</span>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" x-model="editMode" class="sr-only peer" @change="toggleEditMode()">
                    <div class="w-11 h-6 bg-gray-200 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-0.5 after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-marki-primary"></div>
                </label>
                <span class="text-sm text-gray-600">Mode Édition</span>
            </div>
        </div>
    </header>
    
    <!-- Conteneur principal avec disposition personnalisée -->
    <main class="max-w-7xl mx-auto p-6 pt-4">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Colonne 1: Éditeurs d'emails répétés (2/3) -->
            <div class="md:col-span-2">
                {% include 'components/email-editors-container.html' %}
            </div>
            
            <!-- Colonne 2: Variables et liens de paiement (1/3) -->
            <div class="md:col-span-1">
                {% include 'components/variables-panel-alpine.html' %}
            </div>
        </div>
    </main>
    

</body>
</html>
