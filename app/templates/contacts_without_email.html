{% extends "base-app.html" %}
{% block title %}Contacts sans email{% endblock %}
{% block head %}
<script src="{{ url_for('static', filename='js/alpines/impayesStore.js') }}"></script>
<script src="{{ url_for('static', filename='js/alpines/contactsWithoutEmailState.js') }}"></script>
{% endblock %}
{% block content %}
<div x-data="contactsWithoutEmailState" x-init="loadContacts()" class="min-h-screen">
    <!-- Header -->
    <div class="bg-white border border-gray-200 rounded-lg p-4 shadow-sm mb-4">
        <div class="flex flex-wrap items-center justify-between">
            <div class="flex-1 min-w-0 mb-4 md:mb-0">
                <div>
                    <h1 class="text-2xl font-bold">Contacts sans email</h1>
                    <p class="text-sm text-gray-600">
                        <span x-text="filteredContacts.length"></span> contact(s) sans email
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- Filtres -->
    <div class="bg-white border border-gray-200 rounded-lg p-4 shadow-sm mb-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <div class="mb-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Recherche</label>
                    <div>
                        <input
                            type="text"
                            x-model="searchTerm"
                            @input="filterContacts"
                            placeholder="Rechercher par nom..."
                            class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-marki-primary focus:border-transparent"
                        />
                    </div>
                </div>
            </div>
            <div>
                <div class="mb-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Type</label>
                    <div>
                        <select
                            x-model="selectedType"
                            @change="filterContacts"
                            class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-marki-primary focus:border-transparent"
                        >
                            <option value="">Tous</option>
                            <option value="client">Client</option>
                            <option value="fournisseur">Fournisseur</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Liste des contacts -->
    <div class="bg-white border border-gray-200 rounded-lg p-4 shadow-sm">
        <div class="overflow-x-auto">
            <table class="w-full">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="text-left p-2 font-semibold text-sm text-gray-700">Nom</th>
                        <th class="text-left p-2 font-semibold text-sm text-gray-700">Référence facture</th>
                        <th class="text-left p-2 font-semibold text-sm text-gray-700">Date</th>
                        <th class="text-left p-2 font-semibold text-sm text-gray-700">Montant</th>
                        <th class="text-left p-2 font-semibold text-sm text-gray-700">Actions</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-200">
                    <template x-for="contact in paginatedContacts" :key="contact.id">
                        <tr>
                            <td class="p-2">
                                <div class="flex items-center">
                                    <div class="mr-2">
                                        <i :class="contact.type === 'client' ? 'fa-regular fa-user' : 'fa-regular fa-building'" class="text-marki-primary"></i>
                                    </div>
                                    <div>
                                        <span x-text="contact.name"></span>
                                    </div>
                                </div>
                            </td>
                            <td class="p-2">
                                <span x-text="contact.invoiceRef"></span>
                            </td>
                            <td class="p-2">
                                <span x-text="formatDate(contact.invoiceDate)"></span>
                            </td>
                            <td class="p-2">
                                <span x-text="formatCurrency(contact.amount)"></span>
                            </td>
                            <td class="p-2">
                                <!-- Pas d'actions pour cette vue -->
                            </td>
                        </tr>
                    </template>
                    <tr x-show="filteredContacts.length === 0">
                        <td colspan="5" class="text-center p-4 text-gray-500">
                            Aucun contact sans email trouvé
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Pagination -->
    <div class="bg-white border border-gray-200 rounded-lg p-4 shadow-sm">
        <div class="flex flex-wrap items-center justify-between">
            <div class="text-sm text-gray-600">
                Affichage de
                <span x-text="(currentPage - 1) * itemsPerPage + 1"></span>
                à
                <span x-text="Math.min(currentPage * itemsPerPage, filteredContacts.length)"></span>
                sur
                <span x-text="filteredContacts.length"></span> contacts
            </div>
            <div class="flex space-x-2">
                <button
                    @click="previousPage()"
                    :disabled="currentPage === 1"
                    class="px-3 py-1 border border-gray-300 rounded text-sm hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed"
                >
                    Précédent
                </button>
                <button
                    @click="nextPage()"
                    :disabled="currentPage * itemsPerPage >= filteredContacts.length"
                    class="px-3 py-1 border border-gray-300 rounded text-sm hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed"
                >
                    Suivant
                </button>
            </div>
        </div>
    </div>


</div>
{% endblock %}
