<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Éditeur d'email - Sequence {{ sequence_id }}</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <!-- Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    
    <!-- parseAxios configuration -->
    <script src="{{ url_for('static', filename='js/parseAxios.js') }}"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Nano Stores -->
    <script type="module">
        import { atom } from 'https://cdn.jsdelivr.net/npm/nanostores@0.9.5/+esm';
        
        // Store pour la séquence
        export const sequenceStore = atom(null);
        
        // Charger la séquence depuis l'URL
        async function loadSequenceFromUrl() {
            try {
                const pathParts = window.location.pathname.split('/');
                const sequenceId = pathParts[pathParts.length - 2];
                
                if (sequenceId) {
                    // Utilisation de parseAxios au lieu d'axios directement
                    const parseAxios = window.parseAxios;
                    if (parseAxios) {
                        const response = await parseAxios.get(`/classes/Sequences/${sequenceId}`);
                        sequenceStore.set(response.data);
                        console.log('Séquence chargée:', response.data);
                    } else {
                        console.error('parseAxios non disponible');
                    }
                }
            } catch (error) {
                console.error('Erreur lors du chargement de la séquence:', error);
            }
        }
        
        document.addEventListener('DOMContentLoaded', loadSequenceFromUrl);
    </script>
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Conteneur vide pour le composant Lit -->
    <div id="lit-component-container" class="max-w-7xl mx-auto p-6"></div>
    
    <script type="module">
        // Ce script peut être utilisé pour charger votre composant Lit
        console.log('Page prête pour le composant Lit');
    </script>
</body>
</html>
