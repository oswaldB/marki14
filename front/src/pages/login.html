<extends
    src="layouts/noauth-layout.html"
    locals='{"title": "Connexion - Marki14"}'
>
    <block name="body">
        <div class="max-w-md w-full space-y-8">
            <div>
                <h2
                    class="mt-6 text-center text-3xl font-extrabold text-gray-900"
                >
                    Connectez-vous à votre compte
                </h2>
            </div>

            <div x-data="loginState()" class="mt-8 space-y-6">
                <div class="rounded-md shadow-sm -space-y-px">
                    <div>
                        <label for="email-address" class="sr-only"
                            >Adresse email</label
                        >
                        <input
                            id="email-address"
                            name="email"
                            type="email"
                            autocomplete="email"
                            required
                            x-model="email"
                            class="appearance-none rounded-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-t-md focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 focus:z-10 sm:text-sm"
                            placeholder="Adresse email"
                        />
                    </div>
                    <div>
                        <label for="password" class="sr-only"
                            >Mot de passe</label
                        >
                        <input
                            id="password"
                            name="password"
                            type="password"
                            autocomplete="current-password"
                            required
                            x-model="password"
                            class="appearance-none rounded-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-b-md focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 focus:z-10 sm:text-sm"
                            placeholder="Mot de passe"
                        />
                    </div>
                </div>

                <div>
                    <button
                        @click.prevent="login()"
                        :disabled="loading"
                        class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed"
                    >
                        <span x-show="!loading">Se connecter</span>
                        <span x-show="loading">
                            <i class="fas fa-spinner fa-spin"></i> Connexion en
                            cours...
                        </span>
                    </button>
                </div>

                <div x-show="error" class="text-red-600 text-sm text-center">
                    <span x-text="error"></span>
                </div>
            </div>
        </div>
    </block>
</extends>
