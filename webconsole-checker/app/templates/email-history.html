{% extends "base-app.html" %}

{% block content %}
<div class="container mx-auto px-4 py-8" x-data="emailHistoryState()" x-init="init()">
    <!-- En-tête de la page -->
    <div class="flex items-center justify-between mb-6">
        <button onclick="window.history.back()" class="flex items-center text-sky-500 hover:text-sky-700">
            <i class="las la-arrow-left mr-2"></i>
            <span>Retour</span>
        </button>
        <h1 class="text-2xl font-bold text-gray-800">HISTORIQUE #<span x-text="emailId"></span></h1>
    </div>

    <!-- Onglets -->
    <div class="border-b border-gray-200 mb-6">
        <nav class="-mb-px flex space-x-8" aria-label="Tabs">
            <a href="/email/{{ emailId }}" class="border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm">
                Détails
            </a>
            <a href="#" class="border-sky-500 text-sky-600 whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm" aria-current="page">
                Historique
            </a>
        </nav>
    </div>

    <!-- Contenu principal -->
    <div class="bg-white shadow overflow-hidden sm:rounded-lg">
        <div class="px-4 py-5 sm:px-6">
            <!-- Message si historique vide -->
            <template x-if="historyEntries.length === 0">
                <div class="text-center py-12">
                    <i class="las la-history text-4xl text-gray-300 mb-4"></i>
                    <p class="text-gray-500">Aucune modification enregistrée</p>
                </div>
            </template>

            <!-- Liste des modifications -->
            <template x-if="historyEntries.length > 0">
                <div class="divide-y divide-gray-200">
                    <template x-for="entry in historyEntries">
                        <div class="py-4">
                            <div class="flex items-start justify-between">
                                <div class="flex-1">
                                    <!-- Date et utilisateur -->
                                    <div class="flex items-center mb-2">
                                        <img :src="entry.user.avatar || '/static/images/avatar-default.png'" 
                                             alt="Avatar" 
                                             class="h-8 w-8 rounded-full mr-3">
                                        <div>
                                            <p class="text-sm font-medium text-gray-900" x-text="entry.user.name"></p>
                                            <p class="text-sm text-gray-500" x-text="entry.formattedDate"></p>
                                        </div>
                                    </div>

                                    <!-- Modifications -->
                                    <div class="ml-11 mt-2 space-y-1">
                                        <template x-if="entry.changes.subject">
                                            <div class="flex items-start">
                                                <i class="las la-envelope text-sky-500 mt-0.5 mr-2"></i>
                                                <span class="text-sm text-gray-700">
                                                    Objet : "<span x-text="entry.changes.subject.old"></span>" → 
                                                    "<span x-text="entry.changes.subject.new"></span>"
                                                </span>
                                            </div>
                                        </template>

                                        <template x-if="entry.changes.recipients">
                                            <div class="flex items-start">
                                                <i class="las la-users text-sky-500 mt-0.5 mr-2"></i>
                                                <span class="text-sm text-gray-700">
                                                    Destinataires : 
                                                    <template x-if="entry.changes.recipients.added && entry.changes.recipients.added.length > 0">
                                                        +<span x-text="entry.changes.recipients.added.join(', ') "></span>
                                                    </template>
                                                    <template x-if="entry.changes.recipients.removed && entry.changes.recipients.removed.length > 0">
                                                        -<span x-text="entry.changes.recipients.removed.join(', ') "></span>
                                                    </template>
                                                </span>
                                            </div>
                                        </template>

                                        <template x-if="entry.changes.body">
                                            <div class="flex items-start">
                                                <i class="las la-file-alt text-sky-500 mt-0.5 mr-2"></i>
                                                <span class="text-sm text-gray-700">Corps : [Modification]</span>
                                            </div>
                                        </template>
                                    </div>
                                </div>

                                <!-- Bouton Voir les détails -->
                                <template x-if="entry.changes.body">
                                    <div class="ml-4 flex-shrink-0">
                                        <button 
                                            @click="showDiffModal(entry.id, 'body')" 
                                            class="inline-flex items-center px-3 py-1 border border-sky-500 rounded-md text-sm font-medium text-sky-500 bg-white hover:bg-sky-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-sky-500">
                                            Voir les détails
                                        </button>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>
            </template>
        </div>
    </div>

    <!-- Modale de comparaison -->
    <template x-teleport="body">
        <div x-show="showModal" 
             x-transition:enter="transition ease-out duration-300" 
             x-transition:enter-start="opacity-0" 
             x-transition:enter-end="opacity-100" 
             x-transition:leave="transition ease-in duration-200" 
             x-transition:leave-start="opacity-100" 
             x-transition:leave-end="opacity-0" 
             class="fixed inset-0 z-50 overflow-y-auto" 
             aria-labelledby="modal-title" 
             role="dialog" 
             aria-modal="true">
            <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
                <!-- Background overlay -->
                <div x-show="showModal" 
                     x-transition:enter="ease-out duration-300" 
                     x-transition:enter-start="opacity-0" 
                     x-transition:enter-end="opacity-100" 
                     x-transition:leave="ease-in duration-200" 
                     x-transition:leave-start="opacity-100" 
                     x-transition:leave-end="opacity-0" 
                     class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" 
                     aria-hidden="true"></div>

                <!-- Modal content -->
                <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
                <div x-show="showModal" 
                     x-transition:enter="ease-out duration-300" 
                     x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95" 
                     x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100" 
                     x-transition:leave="ease-in duration-200" 
                     x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100" 
                     x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95" 
                     class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-2xl sm:w-full">
                    <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                        <div class="sm:flex sm:items-start">
                            <div class="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left w-full">
                                <h3 class="text-lg leading-6 font-medium text-gray-900" id="modal-title">
                                    Comparaison - Corps de l'email
                                </h3>
                                <div class="mt-4">
                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div class="bg-gray-50 p-4 rounded-lg">
                                            <h4 class="font-medium text-gray-900 mb-2">AVANT</h4>
                                            <div class="bg-white p-3 rounded border border-gray-200 h-64 overflow-y-auto" 
                                                 x-html="diffContent.beforeHtml"></div>
                                        </div>
                                        <div class="bg-gray-50 p-4 rounded-lg">
                                            <h4 class="font-medium text-gray-900 mb-2">APRÈS</h4>
                                            <div class="bg-white p-3 rounded border border-gray-200 h-64 overflow-y-auto" 
                                                 x-html="diffContent.afterHtml"></div>
                                        </div>
                                    </div>
                                    <div class="mt-4 bg-gray-50 p-4 rounded-lg">
                                        <h4 class="font-medium text-gray-900 mb-2">DIFFÉRENCES</h4>
                                        <div class="bg-white p-3 rounded border border-gray-200" 
                                             x-html="diffContent.diffHtml"></div>
                                    </div>
=======
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse">
                        <button @click="closeModal" type="button" 
                                class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-sky-500 sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm">
                            Fermer
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </template>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/templates/email/emailHistoryState.js') }}"></script>
{% endblock %}
