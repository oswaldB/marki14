{% extends "base-app.html" %}

{% block main_content %}
<div class="container mx-auto px-4 py-8" x-data="invoiceEmailState()" x-init="init()">
    <!-- En-tête de la page -->
    <div class="flex items-center justify-between mb-6">
        <button onclick="window.history.back()" class="flex items-center text-sky-500 hover:text-sky-700">
            <i class="las la-arrow-left mr-2"></i>
            <span>Retour</span>
        </button>
        <h1 class="text-2xl font-bold text-gray-800">ENVOI D'EMAIL AVEC FACTURE</h1>
    </div>

    <!-- Formulaire d'envoi d'email -->
    <div class="bg-white shadow overflow-hidden sm:rounded-lg">
        <div class="px-4 py-5 sm:px-6">
            <h2 class="text-lg font-medium text-gray-900">Envoyer un email avec facture</h2>
            <p class="mt-1 max-w-2xl text-sm text-gray-500">Remplissez les informations pour envoyer un email avec un lien de téléchargement de facture</p>
        </div>
        
        <div class="border-t border-gray-200">
            <form @submit.prevent="sendInvoiceEmail" class="space-y-6 p-6">
                <!-- Champ : ID de facture -->
                <div>
                    <label for="invoiceId" class="block text-sm font-medium text-gray-700">ID de facture</label>
                    <div class="mt-1">
                        <input type="text" id="invoiceId" x-model="invoiceId" required 
                               class="shadow-sm focus:ring-sky-500 focus:border-sky-500 block w-full sm:text-sm border-gray-300 rounded-md p-2">
                    </div>
                </div>

                <!-- Champ : Email du destinataire -->
                <div>
                    <label for="recipientEmail" class="block text-sm font-medium text-gray-700">Email du destinataire</label>
                    <div class="mt-1">
                        <input type="email" id="recipientEmail" x-model="recipientEmail" required 
                               class="shadow-sm focus:ring-sky-500 focus:border-sky-500 block w-full sm:text-sm border-gray-300 rounded-md p-2">
                    </div>
                </div>

                <!-- Champ : Nom du destinataire -->
                <div>
                    <label for="recipientName" class="block text-sm font-medium text-gray-700">Nom du destinataire</label>
                    <div class="mt-1">
                        <input type="text" id="recipientName" x-model="recipientName" required 
                               class="shadow-sm focus:ring-sky-500 focus:border-sky-500 block w-full sm:text-sm border-gray-300 rounded-md p-2">
                    </div>
                </div>

                <!-- Champ : Objet de l'email -->
                <div>
                    <label for="emailSubject" class="block text-sm font-medium text-gray-700">Objet de l'email</label>
                    <div class="mt-1">
                        <input type="text" id="emailSubject" x-model="emailSubject" required 
                               class="shadow-sm focus:ring-sky-500 focus:border-sky-500 block w-full sm:text-sm border-gray-300 rounded-md p-2">
                    </div>
                </div>

                <!-- Aperçu du template -->
                <div class="mt-6">
                    <h3 class="text-sm font-medium text-gray-700 mb-2">Aperçu de l'email</h3>
                    <div class="bg-gray-50 p-4 rounded-lg border border-gray-200" x-html="emailPreview">
                        <!-- Aperçu généré dynamiquement -->
                    </div>
                </div>

                <!-- Boutons d'action -->
                <div class="flex justify-end space-x-3 pt-6 border-t border-gray-200">
                    <button type="button" @click="generatePreview" 
                            class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-sky-500 hover:bg-sky-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-sky-500">
                        <i class="las la-eye mr-2"></i>
                        Prévisualiser
                    </button>
                    
                    <button type="submit" 
                            class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500">
                        <i class="las la-paper-plane mr-2"></i>
                        Envoyer l'email
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modale de résultat -->
    <div x-show="showResultModal" class="fixed inset-0 overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div x-show="showResultModal" x-transition:enter="ease-out duration-300" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" x-transition:leave="ease-in duration-200" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0" class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" aria-hidden="true"></div>
            
            <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
            
            <div x-show="showResultModal" x-transition:enter="ease-out duration-300" x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95" x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100" x-transition:leave="ease-in duration-200" x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100" x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95" class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full">
                <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                    <div class="sm:flex sm:items-start">
                        <div :class="resultSuccess ? 'bg-green-100' : 'bg-red-100'" class="mx-auto flex-shrink-0 flex items-center justify-center h-12 w-12 rounded-full sm:mx-0 sm:h-10 sm:w-10">
                            <i :class="resultSuccess ? 'las la-check text-green-600' : 'las la-exclamation-triangle text-red-600'" class="h-6 w-6"></i>
                        </div>
                        
                        <div class="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left">
                            <h3 class="text-lg leading-6 font-medium text-gray-900" id="modal-title">
                                <template x-if="resultSuccess">Envoi réussi</template>
                                <template x-if="!resultSuccess">Erreur d'envoi</template>
                            </h3>
                            
                            <div class="mt-2">
                                <p class="text-sm text-gray-500" x-text="resultMessage"></p>
                                
                                <template x-if="resultSuccess && downloadLink">
                                    <div class="mt-4 bg-gray-50 p-3 rounded-lg">
                                        <p class="text-sm font-medium text-gray-700">Lien de téléchargement :</p>
                                        <a :href="downloadLink" target="_blank" class="text-sm text-sky-600 hover:text-sky-800 break-all">
                                            <span x-text="downloadLink"></span>
                                        </a>
                                        <p class="text-xs text-gray-500 mt-1">Expire le : <span x-text="expiresAt"></span></p>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse">
                    <button @click="closeResultModal" type="button" class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-sky-500 sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm">
                        Fermer
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/templates/invoice/invoiceEmailState.js') }}"></script>
{% endblock %}
