{% extends "base.html" %}

{% block content %}
<div class="min-h-screen bg-gray-50">
    <!-- Barre de navigation -->
    <nav class="bg-sky-500 border-b border-sky-600">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex">
                    <div class="flex-shrink-0 flex items-center">
                        <span class="text-white font-semibold text-lg">WebConsole</span>
                    </div>
                    <div class="hidden sm:ml-6 sm:flex sm:space-x-8">
                        <a href="/" class="border-sky-400 text-white inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
                            Accueil
                        </a>
                        <a href="/email" class="border-transparent text-sky-100 hover:border-sky-300 hover:text-white inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
                            Emails
                        </a>
                        <a href="/admin/configurations" class="border-transparent text-sky-100 hover:border-sky-300 hover:text-white inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
                            Administration
                        </a>
                    </div>
                </div>
                <div class="hidden sm:ml-6 sm:flex sm:items-center">
                    <button type="button" class="bg-sky-600 p-1 rounded-full text-sky-200 hover:text-white focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-sky-500 focus:ring-white">
                        <span class="sr-only">Voir les notifications</span>
                        <i class="las la-bell text-lg"></i>
                    </button>
                    
                    <!-- Menu utilisateur -->
                    <div class="ml-3 relative">
                        <div>
                            <button type="button" class="max-w-xs bg-sky-500 rounded-full flex items-center text-sm focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-sky-500 focus:ring-white" id="user-menu-button" aria-expanded="false" aria-haspopup="true">
                                <span class="sr-only">Ouvrir le menu utilisateur</span>
                                <img class="h-8 w-8 rounded-full" src="/static/images/avatar-default.png" alt="">
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Contenu principal -->
    <main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
        {% block main_content %}{% endblock %}
    </main>
</div>
{% endblock %}

{% block scripts %}
<!-- Scripts spécifiques à l'application -->
<script>
    // Store Alpine pour les appels Parse
    document.addEventListener('alpine:init', () => {
        Alpine.store('parseAxios', {
            // Configuration pour les appels Parse
            baseURL: '{{ url_for("script.script_route", _external=True) }}',
            
            async get(url, config = {}) {
                try {
                    const response = await fetch(url, {
                        method: 'GET',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-Requested-With': 'XMLHttpRequest'
                        },
                        credentials: 'include',
                        ...config
                    });
                    
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    
                    return await response.json();
                } catch (error) {
                    console.error('Erreur dans parseAxios.get:', error);
                    throw error;
                }
            },
            
            async post(url, data = {}, config = {}) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-Requested-With': 'XMLHttpRequest'
                        },
                        body: JSON.stringify(data),
                        credentials: 'include',
                        ...config
                    });
                    
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    
                    return await response.json();
                } catch (error) {
                    console.error('Erreur dans parseAxios.post:', error);
                    throw error;
                }
            }
        });
    });
</script>
{% endblock %}
