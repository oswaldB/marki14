# Configuration de l'agent pour le Product Manager
# Cet agent utilise le prompt detailed_feature_description pour extraire et créer des fichiers de features et use cases.

# Prompt système personnalisé pour le Product Manager
system_prompt_id = "detailed_feature_description"

display_name = "vetted_pm"
description = "Agent spécialisé dans l'extraction et la création de fichiers de features et use cases à partir du fichier specs/idées."
enabled_tools = ["ask_user_question","read_file", "grep", "write_file","search_replace","bash","webfetch","websearch"]
auto_approve = true
